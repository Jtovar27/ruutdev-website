<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="robots" content="noindex, nofollow" />
<title>RuutDev · Sales Qualifier</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&family=Figtree:ital,wght@0,300;0,400;0,500;0,600;1,300&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#07090f;
  --surface:#0e1118;
  --surface2:#141820;
  --border:rgba(255,255,255,0.06);
  --blue:#1a6dff;
  --blue-dim:rgba(26,109,255,0.12);
  --blue-border:rgba(26,109,255,0.25);
  --green:#22c55e;
  --green-dim:rgba(34,197,94,0.1);
  --yellow:#f59e0b;
  --yellow-dim:rgba(245,158,11,0.1);
  --red:#f87171;
  --red-dim:rgba(248,113,113,0.1);
  --text:#ffffff;
  --text2:rgba(255,255,255,0.45);
  --text3:rgba(255,255,255,0.2);
  --font-display:'Bricolage Grotesque',sans-serif;
  --font-body:'Figtree',sans-serif;
  --font-mono:'JetBrains Mono',monospace;
}
html{scroll-behavior:smooth}
body{
  font-family:var(--font-body);
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}

/* ── HEADER ── */
header{
  display:flex;align-items:center;justify-content:space-between;
  padding:20px 24px;
  border-bottom:1px solid var(--border);
  background:rgba(7,9,15,0.9);
  backdrop-filter:blur(20px);
  position:sticky;top:0;z-index:100;
}
.logo{font-family:var(--font-display);font-size:1.1rem;font-weight:800;letter-spacing:-0.03em;display:flex;align-items:center;gap:8px}
.logo-dot{width:8px;height:8px;background:var(--blue);border-radius:50%}
.header-badge{
  font-family:var(--font-mono);font-size:0.68rem;font-weight:500;
  color:var(--text2);letter-spacing:0.08em;
  background:var(--surface2);border:1px solid var(--border);
  padding:4px 12px;border-radius:100px;
}

/* ── MAIN LAYOUT ── */
main{max-width:680px;margin:0 auto;padding:40px 24px 80px}

/* ── PROGRESS ── */
.progress-wrap{margin-bottom:40px}
.progress-meta{
  display:flex;justify-content:space-between;align-items:center;
  margin-bottom:10px;
}
.progress-label{font-size:0.72rem;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;color:var(--text2)}
.progress-count{font-family:var(--font-mono);font-size:0.72rem;color:var(--text3)}
.progress-bar{height:3px;background:var(--surface2);border-radius:2px;overflow:hidden}
.progress-fill{height:100%;background:var(--blue);border-radius:2px;transition:width 0.5s cubic-bezier(0.4,0,0.2,1)}

/* ── CATEGORY LABEL ── */
.category-label{
  display:inline-flex;align-items:center;gap:6px;
  font-size:0.68rem;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;
  color:var(--blue);
  background:var(--blue-dim);border:1px solid var(--blue-border);
  padding:4px 12px;border-radius:100px;
  margin-bottom:20px;
}

/* ── QUESTION ── */
.question-wrap{
  animation:slideIn 0.35s cubic-bezier(0.4,0,0.2,1);
}
@keyframes slideIn{
  from{opacity:0;transform:translateY(16px)}
  to{opacity:1;transform:translateY(0)}
}
.question-text{
  font-family:var(--font-display);
  font-size:clamp(1.4rem,4vw,2rem);
  font-weight:800;
  letter-spacing:-0.03em;
  line-height:1.15;
  margin-bottom:8px;
}
.question-hint{
  font-size:0.85rem;font-weight:300;
  color:var(--text2);line-height:1.6;
  margin-bottom:32px;
}

/* ── OPTIONS ── */
.options{display:flex;flex-direction:column;gap:10px}
.option{
  display:flex;align-items:center;gap:16px;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:14px;padding:18px 20px;
  cursor:pointer;
  transition:all 0.2s ease;
  text-align:left;width:100%;
  position:relative;overflow:hidden;
  color:var(--text);
  font-family:var(--font-body);
}
.option::before{
  content:'';position:absolute;inset:0;
  background:var(--blue);opacity:0;
  transition:opacity 0.2s;
}
.option:hover{border-color:rgba(26,109,255,0.4);background:rgba(26,109,255,0.05)}
.option:hover::before{opacity:0.03}
.option.selected{
  border-color:var(--blue);
  background:var(--blue-dim);
}
.option-icon{
  width:40px;height:40px;flex-shrink:0;
  background:var(--surface2);
  border:1px solid var(--border);
  border-radius:10px;
  display:flex;align-items:center;justify-content:center;
  font-size:1.1rem;
  transition:all 0.2s;
  position:relative;z-index:1;
}
.option.selected .option-icon{background:var(--blue-dim);border-color:var(--blue-border)}
.option-text{flex:1;position:relative;z-index:1}
.option-title{font-size:0.92rem;font-weight:600;margin-bottom:2px;color:var(--text)}
.option-desc{font-size:0.78rem;font-weight:300;color:var(--text2);line-height:1.5}
.option-check{
  width:22px;height:22px;flex-shrink:0;
  border:1px solid var(--border);border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  position:relative;z-index:1;
  transition:all 0.2s;
}
.option.selected .option-check{
  background:var(--blue);border-color:var(--blue);
}
.option.selected .option-check::after{
  content:'✓';font-size:0.65rem;font-weight:700;color:white;
}

/* ── INPUT / TEXTAREA ── */
.input-wrap{position:relative;margin-bottom:8px}
.text-input{
  width:100%;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:14px;
  padding:18px 20px;
  font-family:var(--font-body);
  font-size:0.95rem;
  font-weight:400;
  color:var(--text);
  outline:none;
  transition:border-color 0.2s;
  resize:none;
}
.text-input:focus{border-color:rgba(26,109,255,0.5)}
.text-input::placeholder{color:var(--text3)}

/* ── NAV BUTTONS ── */
.nav-buttons{
  display:flex;gap:10px;margin-top:32px;
}
.btn-back{
  display:flex;align-items:center;gap:6px;
  padding:14px 20px;
  background:transparent;border:1px solid var(--border);
  border-radius:100px;
  font-family:var(--font-body);font-size:0.85rem;font-weight:600;
  color:var(--text2);cursor:pointer;
  transition:all 0.2s;
}
.btn-back:hover{border-color:rgba(255,255,255,0.2);color:var(--text)}
.btn-next{
  flex:1;
  display:flex;align-items:center;justify-content:center;gap:8px;
  padding:14px 24px;
  background:var(--blue);border:none;
  border-radius:100px;
  font-family:var(--font-body);font-size:0.9rem;font-weight:700;
  color:white;cursor:pointer;
  transition:all 0.2s;
  box-shadow:0 4px 20px rgba(26,109,255,0.3);
}
.btn-next:hover{transform:translateY(-1px);box-shadow:0 6px 28px rgba(26,109,255,0.45)}
.btn-next:disabled{opacity:0.3;cursor:not-allowed;transform:none}

/* ── RESULT ── */
.result-wrap{animation:slideIn 0.4s cubic-bezier(0.4,0,0.2,1)}

.result-hero{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:20px;
  padding:32px;
  margin-bottom:16px;
  position:relative;overflow:hidden;
}
.result-hero::before{
  content:'';position:absolute;
  top:-80px;right:-80px;
  width:300px;height:300px;
  background:radial-gradient(circle,rgba(26,109,255,0.08) 0%,transparent 70%);
  border-radius:50%;pointer-events:none;
}
.result-badge{
  display:inline-flex;align-items:center;gap:6px;
  font-size:0.68rem;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;
  padding:4px 12px;border-radius:100px;
  margin-bottom:20px;
}
.badge-green{color:var(--green);background:var(--green-dim);border:1px solid rgba(34,197,94,0.25)}
.badge-blue{color:var(--blue);background:var(--blue-dim);border:1px solid var(--blue-border)}
.badge-yellow{color:var(--yellow);background:var(--yellow-dim);border:1px solid rgba(245,158,11,0.25)}

.result-product{
  font-family:var(--font-display);
  font-size:clamp(1.6rem,4vw,2.4rem);
  font-weight:800;letter-spacing:-0.04em;
  line-height:1.1;margin-bottom:12px;
}
.result-desc{
  font-size:0.9rem;font-weight:300;
  color:var(--text2);line-height:1.75;
  margin-bottom:24px;
}

.result-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:24px}
.result-stat{
  background:var(--surface2);border:1px solid var(--border);
  border-radius:12px;padding:16px;
}
.stat-label{font-size:0.68rem;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--text2);margin-bottom:6px}
.stat-value{font-family:var(--font-display);font-size:1.2rem;font-weight:800;letter-spacing:-0.03em}
.stat-value.green{color:var(--green)}
.stat-value.blue{color:#60a5fa}
.stat-value.yellow{color:var(--yellow)}

.result-includes{margin-bottom:24px}
.includes-title{
  font-size:0.72rem;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;
  color:var(--text2);margin-bottom:12px;
}
.include-item{
  display:flex;align-items:flex-start;gap:10px;
  padding:10px 0;border-bottom:1px solid var(--border);
  font-size:0.85rem;line-height:1.5;
}
.include-item:last-child{border-bottom:none}
.include-dot{
  width:20px;height:20px;flex-shrink:0;
  background:var(--green-dim);border:1px solid rgba(34,197,94,0.25);
  border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:0.6rem;color:var(--green);margin-top:1px;
}

/* Client Brief Card */
.brief-card{
  background:var(--surface);border:1px solid var(--border);
  border-radius:20px;padding:28px;margin-bottom:16px;
}
.brief-title{
  font-family:var(--font-mono);font-size:0.7rem;font-weight:500;
  letter-spacing:0.1em;text-transform:uppercase;
  color:var(--text2);margin-bottom:20px;
  display:flex;align-items:center;gap:8px;
}
.brief-title::after{
  content:'';flex:1;height:1px;background:var(--border);
}
.brief-row{
  display:flex;justify-content:space-between;align-items:flex-start;
  gap:16px;padding:10px 0;border-bottom:1px solid var(--border);
  font-size:0.85rem;
}
.brief-row:last-child{border-bottom:none}
.brief-key{color:var(--text2);font-weight:400;flex-shrink:0;min-width:140px}
.brief-val{color:var(--text);font-weight:600;text-align:right}

/* Notes for vendor */
.vendor-notes{
  background:rgba(245,158,11,0.05);
  border:1px solid rgba(245,158,11,0.15);
  border-radius:14px;padding:20px;margin-bottom:16px;
}
.vendor-notes-title{
  font-size:0.72rem;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;
  color:var(--yellow);margin-bottom:12px;display:flex;align-items:center;gap:6px;
}
.vendor-note-item{
  font-size:0.82rem;font-weight:300;color:rgba(255,255,255,0.6);
  line-height:1.6;padding:6px 0;
  border-bottom:1px solid rgba(255,255,255,0.04);
  display:flex;gap:8px;
}
.vendor-note-item:last-child{border-bottom:none}
.vendor-note-item::before{content:'→';color:var(--yellow);flex-shrink:0}

.result-actions{display:flex;gap:10px;margin-top:8px}
.btn-restart{
  flex:1;padding:14px;
  background:transparent;border:1px solid var(--border);
  border-radius:100px;
  font-family:var(--font-body);font-size:0.85rem;font-weight:600;
  color:var(--text2);cursor:pointer;transition:all 0.2s;
  display:flex;align-items:center;justify-content:center;gap:8px;
}
.btn-restart:hover{border-color:rgba(255,255,255,0.2);color:var(--text)}
.btn-copy{
  flex:2;padding:14px;
  background:var(--blue);border:none;
  border-radius:100px;
  font-family:var(--font-body);font-size:0.85rem;font-weight:700;
  color:white;cursor:pointer;transition:all 0.2s;
  display:flex;align-items:center;justify-content:center;gap:8px;
  box-shadow:0 4px 20px rgba(26,109,255,0.3);
}
.btn-copy:hover{transform:translateY(-1px);box-shadow:0 6px 28px rgba(26,109,255,0.45)}

/* Urgency tag */
.urgency-tag{
  display:inline-flex;align-items:center;gap:6px;
  font-size:0.72rem;font-weight:700;
  padding:4px 10px;border-radius:100px;margin-left:8px;
}
.urgency-alta{background:rgba(248,113,113,0.1);color:var(--red);border:1px solid rgba(248,113,113,0.25)}
.urgency-media{background:var(--yellow-dim);color:var(--yellow);border:1px solid rgba(245,158,11,0.25)}
.urgency-baja{background:var(--green-dim);color:var(--green);border:1px solid rgba(34,197,94,0.25)}

@media(max-width:480px){
  .result-grid{grid-template-columns:1fr}
  .brief-row{flex-direction:column;gap:4px}
  .brief-val{text-align:left}
}
</style>
</head>
<body>

<header>
  <div class="logo"><div class="logo-dot"></div>RuutDev</div>
  <div class="header-badge">SALES QUALIFIER v2.0</div>
</header>

<main>
  <div id="app"></div>
</main>

<script>
const questions = [
  // ── BLOQUE 1: NEGOCIO ──
  {
    id: 'business_name',
    category: '📋 Cliente',

  {
    id: 'social_media',
    category: '🌐 Situación actual',
    text: '¿En qué redes sociales tiene presencia?',

    type: 'multi',
    options: [
      { value: 'instagram', icon: '📸', title: 'Instagram',         desc: '' },
      { value: 'facebook',  icon: '📘', title: 'Facebook',          desc: '' },
      { value: 'whatsapp',  icon: '💬', title: 'WhatsApp Business',  desc: '' },

      { value: 'none',      icon: '🚫', title: 'Ninguna',           desc: '' },

  // ── BLOQUE 3: OBJETIVOS ──

  },
  {
    id: 'primary_cta',
    category: '🎯 Estrategia',
    text: '¿Qué acción quieres que tome el visitante al entrar?',

    type: 'single',
    options: [
      { value: 'schedule', icon: '📅', title: 'Agendar una cita o llamada',      desc: 'Reservar un horario o consulta' },

  },
  {
    id: 'ideal_client',
    category: '🎯 Estrategia',
    text: '¿Cómo es el cliente ideal del negocio?',

let current = 0;
let answers = {};
let multiSelections = {};

function getEl(id){ return document.getElementById(id) }
function app(){ return getEl('app') }

function render(){
  if(current < questions.length){
    renderQuestion();
  } else {
    renderResult();
  }
}

function renderQuestion(){
  const q = questions[current];
  const pct = Math.round((current / questions.length) * 100);
  const isMulti = q.type === 'multi';
  if(!multiSelections[q.id]) multiSelections[q.id] = [];

  let optionsHTML = '';

  if(q.type === 'text'){
    const val = answers[q.id] || '';
    optionsHTML = `
      <div class="input-wrap">
        <input class="text-input" id="textInput" type="text"
          placeholder="${q.placeholder}" value="${val}"
          oninput="answers['${q.id}']=this.value;updateNextBtn()"
          onkeydown="if(event.key==='Enter'&&this.value.trim())nextQ()"
        />
      </div>`;
  } else if(q.type === 'textarea'){
    const val = answers[q.id] || '';
    optionsHTML = `
      <div class="input-wrap">
        <textarea class="text-input" id="textInput"
          placeholder="${q.placeholder}"
          rows="5"
          oninput="answers['${q.id}']=this.value;updateNextBtn()"
        >${val}</textarea>
      </div>`;
  } else if(q.type === 'single'){
    optionsHTML = '<div class="options">' + q.options.map(o => {
      const sel = answers[q.id] === o.value ? 'selected' : '';
      return `<button class="option ${sel}" onclick="selectSingle('${q.id}','${o.value}')">
        <div class="option-icon">${o.icon}</div>
        <div class="option-text">
          <div class="option-title">${o.title}</div>
          ${o.desc ? `<div class="option-desc">${o.desc}</div>` : ''}
        </div>
        <div class="option-check"></div>
      </button>`;
    }).join('') + '</div>';
  } else if(isMulti){
    const sel = multiSelections[q.id];
    optionsHTML = '<div class="options">' + q.options.map(o => {
      const selected = sel.includes(o.value) ? 'selected' : '';
      return `<button class="option ${selected}" onclick="toggleMulti('${q.id}','${o.value}')">
        <div class="option-icon">${o.icon}</div>
        <div class="option-text">
          <div class="option-title">${o.title}</div>
          ${o.desc ? `<div class="option-desc">${o.desc}</div>` : ''}
        </div>
        <div class="option-check"></div>
      </button>`;
    }).join('') + '</div>';
  }

  const canNext = canProceed(q);

  app().innerHTML = `
    <div class="progress-wrap">
      <div class="progress-meta">
        <span class="progress-label">Progreso</span>
        <span class="progress-count">${current + 1} / ${questions.length}</span>
      </div>
      <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
    </div>
    <div class="question-wrap">
      <div class="category-label">${q.category}</div>
      <div class="question-text">${q.text}</div>
      ${q.hint ? `<div class="question-hint">${q.hint}${isMulti ? ' <strong style="color:rgba(255,255,255,0.6)">Puedes elegir varias.</strong>' : ''}</div>` : ''}
      ${optionsHTML}
      <div class="nav-buttons">
        ${current > 0 ? `<button class="btn-back" onclick="prevQ()">← Atrás</button>` : ''}
        <button class="btn-next" id="nextBtn" onclick="nextQ()" ${canNext ? '' : 'disabled'}>
          ${current === questions.length - 1 ? '🎯 Ver resultado' : 'Siguiente →'}
        </button>
      </div>
    </div>`;
}

function canProceed(q){
  if(q.type === 'text' || q.type === 'textarea') return (answers[q.id] || '').trim().length > 0;
  if(q.type === 'single') return answers[q.id] !== undefined;
  if(q.type === 'multi')  return (multiSelections[q.id] || []).length > 0;
  return false;
}

function updateNextBtn(){
  const btn = getEl('nextBtn');
  if(btn) btn.disabled = !canProceed(questions[current]);
}

function selectSingle(id, val){
  answers[id] = val;
  render();
  setTimeout(()=>{ if(canProceed(questions[current])) nextQ(); }, 400);
}

function toggleMulti(id, val){
  const arr = multiSelections[id] || [];
  if(val === 'none'){
    multiSelections[id] = arr.includes('none') ? [] : ['none'];
  } else {
    const filtered = arr.filter(v => v !== 'none');
    const idx = filtered.indexOf(val);
    if(idx > -1) filtered.splice(idx,1); else filtered.push(val);
    multiSelections[id] = filtered;
  }
  answers[id] = multiSelections[id];
  render();
}

function nextQ(){
  const q = questions[current];
  if(!canProceed(q)) return;
  current++;
  window.scrollTo({top:0,behavior:'smooth'});
  render();
}

function prevQ(){
  if(current > 0){ current--; window.scrollTo({top:0,behavior:'smooth'}); render(); }
}

// ── RESULT LOGIC ──
function computeResult(){
  const a = answers;
  const multi = multiSelections;

  const goal    = a.main_goal;
  const sells   = a.sell_products;
  const features = [...(multi.special_features || [])]; // mutable copy
  const budget  = a.budget;

  // New v2 inputs
  const languages_q        = a.languages;
  const needs_ai_q         = a.needs_ai;
  const integrations_q     = multi.integrations || [];
  const meaningfulIntegrations = integrations_q.filter(i => i !== 'none');

  let product    = 'landing';
  let complexity = 'basic';

  // E-commerce path
  if(sells === 'products' || sells === 'both' || sells === 'digital' || goal === 'sell_online'){
    product    = 'ecommerce';
    complexity = 'medium';
  }
  // AI / automation path
  else if(goal === 'automate' || features.includes('chat')){
    product    = 'ai_tool';
    complexity = 'advanced';
  }
  // Landing page path
  else {
    product    = 'landing';
    complexity = features.filter(f => f !== 'none').length >= 3 ? 'medium' : 'basic';
  }

  // Downgrade by budget
  if(budget === 'under_300' && product !== 'landing'){
    product    = 'landing';
    complexity = 'basic';
  }

  // ── v2 overrides ──

  // IA requerida → siempre escalar a ai_tool (a menos que el presupuesto lo impida)
  if(needs_ai_q && needs_ai_q !== 'no' && budget !== 'under_300'){
    product    = 'ai_tool';
    complexity = 'advanced';
  }

  // Idiomas → inyectar multilang si no estaba ya
  if(languages_q === 'both' && !features.includes('multilang')){
    features.push('multilang');
  }

  // Integraciones complejas → subir complexity de basic a medium

        'Sección de servicios / información',
        'Formulario de contacto + botón de WhatsApp',
        'Dominio y hosting incluidos (1er año)',
        'Velocidad optimizada para SEO básico',
      ] : [
        'Todo lo del plan básico',
        'Múltiples secciones (Equipo, FAQ, Testimonios)',
        'Galería de fotos o portafolio',
        'Integración de redes sociales',
        'Optimización SEO avanzada',
        features.includes('booking')   ? 'Sistema de citas / reservaciones' : null,
        features.includes('multilang') ? 'Versión en inglés y español'       : null,
      ].filter(Boolean),
    },
    ecommerce: {
      name: 'Tienda Online (E-commerce)',
      emoji: '🛒',
      badgeClass: 'badge-green',
      badgeText: 'PRODUCTO RECOMENDADO',
      desc: 'Una tienda online completa donde los clientes pueden ver productos, agregarlos al carrito y pagar. Ideal para negocios que quieren vender sin límite de horario ni ubicación.',
      timeline: '10 – 18 días',
      includes: [
        'Catálogo de productos con fotos y precios',
        'Carrito de compras funcional',
        'Integración de pagos (PayPal, Stripe, Zelle)',
        'Panel de administración para el dueño',
        'Filtros por categoría y búsqueda de productos',
        'Diseño adaptado a celular y tablet',

      ].filter(Boolean),
    },
    ai_tool: {
      name: 'Sitio Web + Herramienta con IA',
      emoji: '🤖',
      badgeClass: 'badge-yellow',
      badgeText: 'PRODUCTO RECOMENDADO',
      desc: 'Un sitio web profesional potenciado con inteligencia artificial. Incluye un chatbot que responde preguntas, agenda citas, y atiende clientes automáticamente las 24 horas del día.',
      timeline: '14 – 25 días',
      includes: [
        'Landing page o sitio profesional completo',
        'Chatbot con IA entrenado para el negocio',
        'Respuestas automáticas a preguntas frecuentes',
        'Sistema de agendamiento de citas (si aplica)',
        'Integración con WhatsApp Business',
        'Panel de control para ver conversaciones',
        'Entrenamiento del modelo con datos del negocio',
        features.includes('multilang') ? 'Versión en inglés y español' : null,
      ].filter(Boolean),
    },
  };

  // Price range by location and product
  const priceMap = {
    usa:       { landing: complexity === 'basic' ? '$800 – $1,500'   : '$1,200 – $2,500', ecommerce: '$2,000 – $4,000', ai_tool: '$2,500 – $5,000+' },
    venezuela: { landing: complexity === 'basic' ? '$200 – $400'     : '$350 – $700',     ecommerce: '$600 – $1,200',   ai_tool: '$800 – $1,800' },
    latam:     { landing: complexity === 'basic' ? '$400 – $900'     : '$700 – $1,500',   ecommerce: '$1,000 – $2,500', ai_tool: '$1,500 – $3,000' },
  };

  const location  = a.location || 'undefined';
  const priceRange = priceMap[location]?.[product] || 'A cotizar';

  // ── Vendor notes ──
  const notes = [];

  // V1 notes
  if(a.decision_maker !== 'owner')
    notes.push('No hablas con el dueño — pide una reunión con quien toma decisiones.');
  if(a.urgency === 'urgent')
    notes.push('Alta urgencia: priorizar y responder rápido para no perder el cliente.');
  if(a.urgency === 'exploring')
    notes.push('Solo explorando — usa la demo gratis para generar compromiso emocional.');
  if(budget === 'under_300' && location === 'usa')
    notes.push('Presupuesto muy bajo para USA — considera solo una landing básica.');
  if(!a.has_website || a.has_website === 'none')
    notes.push('No tiene sitio web — énfasis en pérdida de clientes actuales por no tener presencia online.');
  if(a.has_website === 'bad')
    notes.push('Tiene un sitio malo — muéstrale el contraste con la demo para que vea la diferencia.');
  if((multi.clients_source || []).includes('word_mouth') && !(multi.clients_source || []).includes('google'))
    notes.push('Depende del boca a boca — explica que un sitio web multiplica ese alcance sin esfuerzo extra.');
  if(features.includes('payments') && location !== 'usa')
    notes.push('Pagos online fuera del mercado principal — confirmar método de pago y alcance antes de cotizar.');

  // V2 notes
  if(a.primary_cta === 'whatsapp')
    notes.push('CTA principal: WhatsApp — destacar botón flotante y link directo en el hero.');

  if(a.primary_cta === 'schedule' && !features.includes('booking') && !integrations_q.includes('calendly'))
    notes.push('CTA es "agendar cita" pero no hay sistema de reservas — confirmar si usará Calendly u otro antes de cotizar.');

  if(a.has_domain === 'no')
    notes.push('Sin dominio comprado — registrar dominio antes de iniciar el proyecto (sumar al presupuesto si aplica).');
  else if(a.has_domain === 'unknown')
    notes.push('Dominio no confirmado — verificar acceso al panel DNS antes de comenzar el desarrollo.');

  if(needs_ai_q && needs_ai_q !== 'no' && a.main_goal !== 'automate'){
    const aiLabel = { chatbot:'Chatbot / asistente virtual', quote_gen:'Generador de cotizaciones', other:'Función con IA a definir' }[needs_ai_q] || needs_ai_q;
    notes.push(`IA requerida: ${aiLabel} — producto escalado automáticamente a Sitio Web + IA.`);
  }

  if(meaningfulIntegrations.length > 0){
    const intLabels = { calendly:'Calendly', web3forms:'Formulario', fb_pixel:'FB Pixel', ga:'Google Analytics', maps:'Google Maps', whatsapp_btn:'Botón WhatsApp' };
    notes.push(`Integraciones: ${meaningfulIntegrations.map(i => intLabels[i]||i).join(', ')} — verificar cuentas activas del cliente antes de desarrollar.`);
  }

  if(a.has_brand === 'no')
    notes.push('Sin identidad visual — cotizar creación de marca básica (logo, colores, tipografía) como ítem separado.');
  else if(a.has_brand === 'partial')
    notes.push('Solo tiene logo — solicitar archivo vectorial (SVG o AI) antes de iniciar el diseño.');

  if(a.has_photos === 'stock')
    notes.push('Sin fotos reales — usar banco de imágenes. Recomendar sesión fotográfica para mayor conversión (vender como servicio adicional).');
  else if(a.has_photos === 'real_phone')
    notes.push('Fotos de teléfono — revisar calidad y resolución antes de aceptar el material.');

  if(a.differentials && a.differentials.trim().length > 10){
    const snippet = a.differentials.trim().substring(0, 100);
    notes.push(`Diferenciales para copy: "${snippet}${a.differentials.length > 100 ? '...' : ''}" — usar como eje del mensaje principal del sitio.`);
  }

  if(a.has_testimonials === 'no')
    notes.push('Sin testimonios — incluir sección placeholder o proponer al cliente que recopile 3 reseñas antes del lanzamiento.');

  return { product: products[product], priceRange, notes, location, budget, urgency: a.urgency };
}

function renderResult(){
  const { product, priceRange, notes, location, budget, urgency } = computeResult();
  const a   = answers;
  const ms  = multiSelections;

  const urgencyConfig = {
    urgent:    { label: 'ALTA',  cls: 'urgency-alta'  },
    soon:      { label: 'MEDIA', cls: 'urgency-media' },
    exploring: { label: 'BAJA',  cls: 'urgency-baja'  },
  };
  const urg = urgencyConfig[urgency] || urgencyConfig.soon;

  const locationLabels = { usa: '🇺🇸 Florida / USA', venezuela: '🇺🇸 Otro estado de EE.UU.', latam: '🌎 Fuera de EE.UU.' };

  // ── Label mappers ──
  const industryLabel    = { restaurant:'Restaurante/Comida', health:'Salud/Bienestar', beauty:'Belleza', retail:'Tienda/Comercio', services:'Servicios profesionales', real_estate:'Inmobiliaria', education:'Educación', other:'Otro' }[a.industry] || a.industry;
  const siteGoalLabel    = { sell:'Vender directamente', leads_whatsapp:'Leads por WhatsApp', leads_form:'Leads por formulario', inform:'Informar', brand:'Posicionar marca' }[a.site_goal] || '—';
  const ctaLabel         = { schedule:'Agendar cita', buy:'Comprar', whatsapp:'Escribir por WhatsApp', form:'Formulario de contacto', quote:'Solicitar cotización' }[a.primary_cta] || '—';
  const langLabel        = { es:'Solo español', en:'Solo inglés', both:'Español + Inglés' }[a.languages] || '—';
  const testimonialLabel = { google:'Reseñas en Google', manual:'Testimonios escritos', both:'Google + propios', no:'Sin testimonios' }[a.has_testimonials] || '—';
  const domainLabel      = { yes:'Sí, tiene dominio', no:'Sin dominio', unknown:'No confirmado' }[a.has_domain] || '—';
  const needsAiLabel     = { no:'No requiere IA', chatbot:'Chatbot / Asistente', quote_gen:'Generador de cotizaciones', other:'IA — a definir' }[a.needs_ai] || '—';
  const brandLabel       = { complete:'Manual completo', partial:'Solo logo', no:'Sin identidad visual' }[a.has_brand] || '—';
  const photosLabel      = { real_pro:'Fotos profesionales', real_phone:'Fotos de teléfono', stock:'Imágenes de stock', both:'Propias + stock' }[a.has_photos] || '—';
  
  // INYECCIÓN: Label para tipografía
  const fontLabel        = { serif:'Serif (Clásico)', sans:'Sans-Serif (Moderno)', display:'Display (Impactante)', mono:'Monospace (Técnico)' }[a.font_style] || '—';

  const sectionsList     = (ms.sections || []).map(s => ({ hero:'Inicio', about:'Nosotros', services:'Servicios', testimonials:'Testimonios', faq:'FAQ', contact:'Contacto', gallery:'Galería', blog:'Blog' }[s]||s)).join(', ') || '—';
  const integrationsList = (ms.integrations || []).filter(i => i !== 'none').map(i => ({ calendly:'Calendly', web3forms:'Formulario', fb_pixel:'FB Pixel', ga:'Analytics', maps:'Maps', whatsapp_btn:'WhatsApp btn' }[i]||i)).join(', ') || 'Ninguna';
  const feelingList      = (ms.brand_feeling || []).map(f => ({ trust:'Confianza', luxury:'Lujo', speed:'Rapidez', warmth:'Cercanía', modern:'Moderno', minimal:'Minimalista' }[f]||f)).join(', ') || '—';
  const socialList       = (ms.social_media || []).join(', ') || 'Ninguna';

  const featureList = (ms.special_features || []).length > 0
    ? (ms.special_features || []).map(f => ({ booking:'Citas', menu:'Catálogo', chat:'Chatbot IA', payments:'Pagos', multilang:'Bilingüe', none:'Básico' }[f]||f)).join(', ')
    : 'Básico';

  const includesHTML = product.includes.map(item =>
    `<div class="include-item"><div class="include-dot">✓</div><span>${item}</span></div>`
  ).join('');

  const notesHTML = notes.length > 0 ? `
    <div class="vendor-notes">
      <div class="vendor-notes-title">⚡ Notas para el vendedor</div>
      ${notes.map(n => `<div class="vendor-note-item">${n}</div>`).join('')}
    </div>` : '';

  // Helper: truncate long text for display
  const trunc = (str, len=80) => str ? str.substring(0,len) + (str.length > len ? '…' : '') : '—';

  app().innerHTML = `
    <div class="result-wrap">
      <div class="result-hero">
        <div class="result-badge ${product.badgeClass}">${product.badgeText}</div>
        <div class="result-product">${product.emoji} ${product.name}</div>
        <div class="result-desc">${product.desc}</div>

        <div class="result-grid">
          <div class="result-stat">
            <div class="stat-label">Precio estimado</div>
            <div class="stat-value green">${priceRange}</div>
          </div>
          <div class="result-stat">
            <div class="stat-label">Tiempo de entrega</div>
            <div class="stat-value blue">${product.timeline}</div>
          </div>
          <div class="result-stat">
            <div class="stat-label">Urgencia</div>
            <div class="stat-value"><span class="urgency-tag ${urg.cls}">${urg.label}</span></div>
          </div>
          <div class="result-stat">
            <div class="stat-label">Mercado</div>
            <div class="stat-value yellow">${locationLabels[a.location] || '—'}</div>
          </div>
        </div>

        <div class="result-includes">
          <div class="includes-title">✦ Qué incluye este producto</div>
          ${includesHTML}
        </div>
      </div>

      <div class="brief-card">
        <div class="brief-title">Brief del cliente</div>
        <div class="brief-row"><span class="brief-key">Negocio</span><span class="brief-val">${a.business_name || '—'}</span></div>
        <div class="brief-row"><span class="brief-key">Industria</span><span class="brief-val">${industryLabel}</span></div>
        <div class="brief-row"><span class="brief-key">Ubicación</span><span class="brief-val">${locationLabels[a.location] || '—'}</span></div>
        <div class="brief-row"><span class="brief-key">Sitio web actual</span><span class="brief-val">${{none:'Ninguno',bad:'Desactualizado',basic:'Básico',good:'Quiere mejorar'}[a.has_website]||'—'}</span></div>
        <div class="brief-row"><span class="brief-key">Redes sociales</span><span class="brief-val">${socialList}</span></div>
        <div class="brief-row"><span class="brief-key">Objetivo del negocio</span><span class="brief-val">${{visibility:'Ser encontrado en Google',sell_online:'Vender online',credibility:'Verse profesional',automate:'Automatizar',all:'Todo'}[a.main_goal]||'—'}</span></div>
        <div class="brief-row"><span class="brief-key">Objetivo del sitio</span><span class="brief-val">${siteGoalLabel}</span></div>
        <div class="brief-row"><span class="brief-key">CTA principal</span><span class="brief-val">${ctaLabel}</span></div>
        <div class="brief-row"><span class="brief-key">Cliente ideal</span><span class="brief-val">${trunc(a.ideal_client)}</span></div>
        <div class="brief-row"><span class="brief-key">Diferenciales</span><span class="brief-val">${trunc(a.differentials)}</span></div>
        <div class="brief-row"><span class="brief-key">Secciones</span><span class="brief-val">${sectionsList}</span></div>
        <div class="brief-row"><span class="brief-key">Servicios principales</span><span class="brief-val">${trunc(a.main_services)}</span></div>
        <div class="brief-row"><span class="brief-key">Testimonios</span><span class="brief-val">${testimonialLabel}</span></div>
        <div class="brief-row"><span class="brief-key">Idioma(s)</span><span class="brief-val">${langLabel}</span></div>
        <div class="brief-row"><span class="brief-key">Funciones requeridas</span><span class="brief-val">${featureList}</span></div>
        <div class="brief-row"><span class="brief-key">Integraciones</span><span class="brief-val">${integrationsList}</span></div>
        <div class="brief-row"><span class="brief-key">Dominio</span><span class="brief-val">${domainLabel}</span></div>
        <div class="brief-row"><span class="brief-key">Requiere IA</span><span class="brief-val">${needsAiLabel}</span></div>
        <div class="brief-row"><span class="brief-key">Identidad visual</span><span class="brief-val">${brandLabel}</span></div>
        <div class="brief-row"><span class="brief-key">Colores de marca</span><span class="brief-val">${a.custom_colors || '—'}</span></div>
        <div class="brief-row"><span class="brief-key">Tipografía</span><span class="brief-val">${fontLabel}</span></div>
        <div class="brief-row"><span class="brief-key">Fotos disponibles</span><span class="brief-val">${photosLabel}</span></div>
        <div class="brief-row"><span class="brief-key">Sites de referencia</span><span class="brief-val">${trunc(a.reference_sites)}</span></div>
        <div class="brief-row"><span class="brief-key">Sensación / Feeling</span><span class="brief-val">${feelingList}</span></div>
        <div class="brief-row"><span class="brief-key">Presupuesto</span><span class="brief-val">${{under_300:'Menos de $300','300_800':'$300–$800','800_2000':'$800–$2,000',over_2000:'Más de $2,000',undefined:'No definido'}[a.budget]||'—'}</span></div>
        <div class="brief-row"><span class="brief-key">Quién decide</span><span class="brief-val">${{owner:'El dueño',manager:'Gerente (consulta al dueño)',other:'Empleado / otro'}[a.decision_maker]||'—'}</span></div>
      </div>

      ${notesHTML}

      <div class="result-actions">
        <button class="btn-restart" onclick="restart()">↩ Nuevo cliente</button>
        <button class="btn-copy" onclick="copyBrief()">📋 Copiar brief</button>
      </div>
    </div>`;
}

function restart(){
  current = 0; answers = {}; multiSelections = {};
  window.scrollTo({top:0,behavior:'smooth'});
  render();
}

function copyBrief(){
  const a   = answers;
  const ms  = multiSelections;
  const { product, priceRange, notes } = computeResult();
  const locationLabels = { usa:'Florida / USA', venezuela:'Otro estado de EE.UU.', latam:'Fuera de EE.UU.' };

  // INYECCIÓN: Formateo para portapapeles
  const fontLabel        = { serif:'Serif (Clásico)', sans:'Sans-Serif (Moderno)', display:'Display (Impactante)', mono:'Monospace (Técnico)' }[a.font_style] || '—';

  const socialList       = (ms.social_media || []).join(', ') || 'Ninguna';
  const sectionsList     = (ms.sections || []).map(s => ({ hero:'Inicio', about:'Nosotros', services:'Servicios', testimonials:'Testimonios', faq:'FAQ', contact:'Contacto', gallery:'Galería', blog:'Blog' }[s]||s)).join(', ') || '—';
  const integrationsList = (ms.integrations || []).filter(i => i !== 'none').map(i => ({ calendly:'Calendly', web3forms:'Formulario', fb_pixel:'FB Pixel', ga:'Analytics', maps:'Maps', whatsapp_btn:'WhatsApp btn' }[i]||i)).join(', ') || 'Ninguna';
  const feelingList      = (ms.brand_feeling || []).map(f => ({ trust:'Confianza', luxury:'Lujo', speed:'Rapidez', warmth:'Cercanía', modern:'Moderno', minimal:'Minimalista' }[f]||f)).join(', ') || '—';
  const featureList      = (ms.special_features || []).filter(f => f !== 'none').map(f => ({ booking:'Citas', menu:'Catálogo', chat:'Chatbot IA', payments:'Pagos', multilang:'Bilingüe' }[f]||f)).join(', ') || 'Básico';

  const text = `
━━━━━━━━━━━━━━━━━━━━━━━━
BRIEF RUUTDEV — ${new Date().toLocaleDateString('es')}
━━━━━━━━━━━━━━━━━━━━━━━━
Negocio: ${a.business_name || '—'}
Producto recomendado: ${product.name}
Precio estimado: ${priceRange}
Tiempo de entrega: ${product.timeline}
Mercado: ${locationLabels[a.location]||'—'}
Urgencia: ${{ urgent:'Alta', soon:'Media', exploring:'Baja' }[a.urgency]||'—'}

BRIEF CLIENTE:
• Industria: ${{ restaurant:'Restaurante/Comida', health:'Salud/Bienestar', beauty:'Belleza', retail:'Tienda/Comercio', services:'Servicios profesionales', real_estate:'Inmobiliaria', education:'Educación', other:'Otro' }[a.industry]||'—'}
• Sitio web actual: ${{none:'Ninguno',bad:'Desactualizado',basic:'Básico',good:'Quiere mejorar'}[a.has_website]||'—'}
• Redes sociales: ${socialList}
• Objetivo negocio: ${{visibility:'Ser encontrado en Google',sell_online:'Vender online',credibility:'Verse profesional',automate:'Automatizar',all:'Todo'}[a.main_goal]||'—'}
• Objetivo sitio: ${{sell:'Vender directamente',leads_whatsapp:'Leads por WhatsApp',leads_form:'Leads por formulario',inform:'Informar',brand:'Posicionar marca'}[a.site_goal]||'—'}
• CTA principal: ${{schedule:'Agendar cita',buy:'Comprar',whatsapp:'Escribir por WhatsApp',form:'Formulario de contacto',quote:'Solicitar cotización'}[a.primary_cta]||'—'}
• Cliente ideal: ${a.ideal_client||'—'}
• Diferenciales: ${a.differentials||'—'}
• Secciones: ${sectionsList}
• Servicios principales: ${a.main_services||'—'}
• Testimonios: ${{google:'Reseñas Google',manual:'Testimonios escritos',both:'Google + propios',no:'Sin testimonios'}[a.has_testimonials]||'—'}
• Idioma(s): ${{es:'Solo español',en:'Solo inglés',both:'Español + Inglés'}[a.languages]||'—'}
• Funciones requeridas: ${featureList}
• Integraciones: ${integrationsList}
• Dominio: ${{yes:'Sí tiene',no:'Sin dominio',unknown:'No confirmado'}[a.has_domain]||'—'}
• Requiere IA: ${{no:'No',chatbot:'Chatbot',quote_gen:'Cotizador automático',other:'Sí (a definir)'}[a.needs_ai]||'—'}
• Identidad visual: ${{complete:'Manual completo',partial:'Solo logo',no:'Sin identidad'}[a.has_brand]||'—'}
• Colores custom: ${a.custom_colors || 'Ninguno (Usar default)'}
• Estilo Tipografía: ${fontLabel}
• Fotos: ${{real_pro:'Profesionales',real_phone:'Teléfono',stock:'Stock',both:'Mixtas'}[a.has_photos]||'—'}
• Sites de referencia: ${a.reference_sites||'—'}
• Feeling / sensación: ${feelingList}
• Presupuesto: ${{under_300:'<$300','300_800':'$300–$800','800_2000':'$800–$2,000',over_2000:'>$2,000',undefined:'No definido'}[a.budget]||'—'}
• Toma decisión: ${{owner:'El dueño',manager:'Gerente',other:'Empleado'}[a.decision_maker]||'—'}

INSTRUCCIÓN DE DISEÑO PARA CLAUDE CODE:
${a.custom_colors ? `IGNORAR la paleta de colores azul (#1a6dff) de RuutDev. Utilizar estrictamente los colores custom del cliente: ${a.custom_colors}.` : 'Utilizar paleta y tipografía por defecto de RuutDev.'}

${notes.length > 0 ? 'NOTAS VENDEDOR:\n' + notes.map(n=>`• ${n}`).join('\n') : ''}
━━━━━━━━━━━━━━━━━━━━━━━━`.trim();

  navigator.clipboard.writeText(text).then(()=>{
    const btn = document.querySelector('.btn-copy');
    btn.textContent = '✅ Copiado al portapapeles';
    setTimeout(()=>{ btn.innerHTML = '📋 Copiar brief'; },2000);
  });
}

render();
</script>
</body>
</html>

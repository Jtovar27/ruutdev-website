<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>RuutDev · Sales Qualifier v2.5</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#07090f;
  --surface:#0e1118;
  --surface2:#141820;
  --border:rgba(255,255,255,0.06);
  --blue:#1a6dff;
  --blue-dim:rgba(26,109,255,0.12);
  --blue-border:rgba(26,109,255,0.25);
  --green:#22c55e;
  --green-dim:rgba(34,197,94,0.1);
  --yellow:#f59e0b;
  --yellow-dim:rgba(245,158,11,0.1);
  --red:#f87171;
  --red-dim:rgba(248,113,113,0.1);
  --text:#ffffff;
  --text2:rgba(255,255,255,0.45);
  --text3:rgba(255,255,255,0.2);
  --font-display:'Syne',sans-serif;
  --font-body:'DM Sans',sans-serif;
  --font-mono:'JetBrains Mono',monospace;
}
html{scroll-behavior:smooth}
body{
  font-family:var(--font-body);
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}

/* ── HEADER ── */
header{
  display:flex;align-items:center;justify-content:space-between;
  padding:20px 24px;
  border-bottom:1px solid var(--border);
  background:rgba(7,9,15,0.9);
  backdrop-filter:blur(20px);
  position:sticky;top:0;z-index:100;
}
.logo{font-family:var(--font-display);font-size:1.1rem;font-weight:800;letter-spacing:-0.03em;display:flex;align-items:center;gap:8px}
.logo-dot{width:8px;height:8px;background:var(--blue);border-radius:50%}
.header-badge{
  font-family:var(--font-mono);font-size:0.68rem;font-weight:500;
  color:var(--text2);letter-spacing:0.08em;
  background:var(--surface2);border:1px solid var(--border);
  padding:4px 12px;border-radius:100px;
}

/* ── MAIN LAYOUT ── */
main{max-width:680px;margin:0 auto;padding:40px 24px 80px}

/* ── PROGRESS ── */
.progress-wrap{margin-bottom:40px}
.progress-meta{
  display:flex;justify-content:space-between;align-items:center;
  margin-bottom:10px;
}
.progress-label{font-size:0.72rem;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;color:var(--text2)}
.progress-count{font-family:var(--font-mono);font-size:0.72rem;color:var(--text3)}
.progress-bar{height:3px;background:var(--surface2);border-radius:2px;overflow:hidden}
.progress-fill{height:100%;background:var(--blue);border-radius:2px;transition:width 0.5s cubic-bezier(0.4,0,0.2,1)}

/* ── CATEGORY LABEL ── */
.category-label{
  display:inline-flex;align-items:center;gap:6px;
  font-size:0.68rem;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;
  color:var(--blue);
  background:var(--blue-dim);border:1px solid var(--blue-border);
  padding:4px 12px;border-radius:100px;
  margin-bottom:20px;
}

/* ── QUESTION ── */
.question-wrap{
  animation:slideIn 0.35s cubic-bezier(0.4,0,0.2,1);
}
@keyframes slideIn{
  from{opacity:0;transform:translateY(16px)}
  to{opacity:1;transform:translateY(0)}
}
.question-text{
  font-family:var(--font-display);
  font-size:clamp(1.4rem,4vw,2rem);
  font-weight:800;
  letter-spacing:-0.03em;
  line-height:1.15;
  margin-bottom:8px;
}
.question-hint{
  font-size:0.85rem;font-weight:300;
  color:var(--text2);line-height:1.6;
  margin-bottom:32px;
}

/* ── OPTIONS ── */
.options{display:flex;flex-direction:column;gap:10px}
.option{
  display:flex;align-items:center;gap:16px;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:14px;padding:18px 20px;
  cursor:pointer;
  transition:all 0.2s ease;
  text-align:left;width:100%;
  position:relative;overflow:hidden;
  color:var(--text);
  font-family:var(--font-body);
}
.option:hover{border-color:rgba(26,109,255,0.4);background:rgba(26,109,255,0.05)}
.option.selected{
  border-color:var(--blue);
  background:var(--blue-dim);
}
.option-icon{
  width:40px;height:40px;flex-shrink:0;
  background:var(--surface2);
  border:1px solid var(--border);
  border-radius:10px;
  display:flex;align-items:center;justify-content:center;
  font-size:1.1rem;
  position:relative;z-index:1;
}
.option-text{flex:1;position:relative;z-index:1}
.option-title{font-size:0.92rem;font-weight:600;margin-bottom:2px;color:var(--text)}
.option-desc{font-size:0.78rem;font-weight:300;color:var(--text2);line-height:1.5}
.option-check{
  width:22px;height:22px;flex-shrink:0;
  border:1px solid var(--border);border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  transition:all 0.2s;
}
.option.selected .option-check{
  background:var(--blue);border-color:var(--blue);
}
.option.selected .option-check::after{
  content:'✓';font-size:0.65rem;font-weight:700;color:white;
}

/* ── INPUT / TEXTAREA ── */
.text-input{
  width:100%;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:14px;
  padding:18px 20px;
  font-family:var(--font-body);
  font-size:0.95rem;
  color:var(--text);
  outline:none;
  transition:border-color 0.2s;
  resize:none;
}
.text-input:focus{border-color:rgba(26,109,255,0.5)}

/* ── NAV BUTTONS ── */
.nav-buttons{display:flex;gap:10px;margin-top:32px}
.btn-back{
  padding:14px 20px;
  background:transparent;border:1px solid var(--border);
  border-radius:100px;color:var(--text2);cursor:pointer;
}
.btn-next{
  flex:1;padding:14px 24px;
  background:var(--blue);border:none;
  border-radius:100px;font-weight:700;
  color:white;cursor:pointer;
  box-shadow:0 4px 20px rgba(26,109,255,0.3);
}
.btn-next:disabled{opacity:0.3;cursor:not-allowed}

/* ── RESULT CARDS ── */
.result-hero{
  background:var(--surface);border:1px solid var(--border);
  border-radius:20px;padding:32px;margin-bottom:16px;
}
.result-badge{
  display:inline-flex;padding:4px 12px;border-radius:100px;
  font-size:0.68rem;font-weight:700;margin-bottom:20px;
}
.badge-blue{color:var(--blue);background:var(--blue-dim);border:1px solid var(--blue-border)}
.badge-green{color:var(--green);background:var(--green-dim);border:1px solid rgba(34,197,94,0.25)}
.badge-yellow{color:var(--yellow);background:var(--yellow-dim);border:1px solid rgba(245,158,11,0.25)}

.brief-card{
  background:var(--surface);border:1px solid var(--border);
  border-radius:20px;padding:28px;margin-bottom:16px;
}
.brief-row{
  display:flex;justify-content:space-between;padding:10px 0;
  border-bottom:1px solid var(--border);font-size:0.85rem;
}
.brief-key{color:var(--text2)}
.brief-val{color:var(--text);font-weight:600;text-align:right}

.vendor-notes{
  background:rgba(245,158,11,0.05);border:1px solid rgba(245,158,11,0.15);
  border-radius:14px;padding:20px;margin-bottom:16px;
}
.vendor-note-item{font-size:0.82rem;color:rgba(255,255,255,0.6);margin-bottom:8px}

.btn-copy{
  width:100%;padding:16px;background:var(--blue);border:none;
  border-radius:100px;color:white;font-weight:700;cursor:pointer;
}
</style>
</head>
<body>

<header>
  <div class="logo"><div class="logo-dot"></div>RuutDev</div>
  <div class="header-badge">QUALIFIER v2.5 · DESIGN FOCUS</div>
</header>

<main>
  <div id="app"></div>
</main>

<script>
const questions = [
  {
    id: 'business_name',
    category: '📋 Cliente',
    text: '¿Cuál es el nombre del negocio?',
    type: 'text',
    placeholder: 'Ej: Barbería El Barón, Clínica Salud Total...',
  },
  {
    id: 'industry',
    category: '📋 Cliente',
    text: '¿A qué se dedica el negocio?',
    type: 'single',
    options: [
      { value: 'restaurant', icon: '🍽️', title: 'Restaurante / Comida' },
      { value: 'health', icon: '🏥', title: 'Salud / Bienestar' },
      { value: 'beauty', icon: '✂️', title: 'Belleza / Cuidado personal' },
      { value: 'retail', icon: '🛍️', title: 'Tienda / Comercio' },
      { value: 'services', icon: '🔧', title: 'Servicios profesionales' },
      { value: 'other', icon: '💼', title: 'Otro' },
    ],
  },
  {
    id: 'location',
    category: '📋 Cliente',
    text: '¿Dónde está ubicado?',
    type: 'single',
    options: [
      { value: 'usa', icon: '🇺🇸', title: 'Estados Unidos' },
      { value: 'venezuela', icon: '🇻🇪', title: 'Venezuela' },
      { value: 'latam', icon: '🌎', title: 'Latinoamérica' },
    ],
  },
  {
    id: 'main_goal',
    category: '🎯 Objetivo',
    text: '¿Qué quiere lograr el cliente?',
    type: 'single',
    options: [
      { value: 'visibility', icon: '👁️', title: 'Visibilidad / Google' },
      { value: 'sell_online', icon: '🛒', title: 'Vender online' },
      { value: 'automate', icon: '🤖', title: 'Automatizar procesos' },
      { value: 'credibility', icon: '🏆', title: 'Imagen profesional' },
    ],
  },

  // ── BLOQUE DISEÑO (NEW) ──
  {
    id: 'has_brand',
    category: '🎨 Diseño',
    text: '¿Tienen identidad visual?',
    type: 'single',
    options: [
      { value: 'complete', icon: '✅', title: 'Manual completo' },
      { value: 'partial', icon: '🟡', title: 'Solo logo' },
      { value: 'no', icon: '❌', title: 'No tiene nada' },
    ],
  },
  {
    id: 'custom_colors',
    category: '🎨 Diseño',
    text: '¿Qué colores definen la marca?',
    hint: 'IMPORTANTE: Esto anula el estilo base de RuutDev.',
    type: 'text',
    placeholder: 'Ej: #FF5733 y Negro, o "Azul Marino y Dorado"',
  },
  {
    id: 'font_style',
    category: '🎨 Diseño',
    text: '¿Estilo de tipografía preferido?',
    type: 'single',
    options: [
      { value: 'serif', icon: '📜', title: 'Serif (Elegante/Clásico)' },
      { value: 'sans', icon: '📱', title: 'Sans-Serif (Limpio/Moderno)' },
      { value: 'display', icon: '🎨', title: 'Display/Bold (Impactante)' },
      { value: 'mono', icon: '💻', title: 'Monospace (Técnico)' },
    ],
  },
  {
    id: 'brand_feeling',
    category: '🎨 Diseño',
    text: '¿Qué sensación debe transmitir?',
    type: 'multi',
    options: [
      { value: 'trust', icon: '🛡️', title: 'Confianza' },
      { value: 'luxury', icon: '💎', title: 'Lujo' },
      { value: 'modern', icon: '🚀', title: 'Modernidad' },
      { value: 'warmth', icon: '🤝', title: 'Cercanía' },
      { value: 'minimal', icon: '◻️', title: 'Minimalismo' },
    ],
  },

  // ── BLOQUE TÉCNICO ──
  {
    id: 'sell_products',
    category: '🛒 Funciones',
    text: '¿Vende productos o servicios?',
    type: 'single',
    options: [
      { value: 'services_only', icon: '🔧', title: 'Solo servicios' },
      { value: 'products', icon: '📦', title: 'Productos físicos' },
      { value: 'both', icon: '⚡', title: 'Ambos' },
    ],
  },
  {
    id: 'needs_ai',
    category: '🤖 IA',
    text: '¿Requiere funciones de IA?',
    type: 'single',
    options: [
      { value: 'no', icon: '❌', title: 'No requiere' },
      { value: 'chatbot', icon: '🤖', title: 'Chatbot / Asistente' },
      { value: 'quote_gen', icon: '💰', title: 'Cotizador automático' },
    ],
  },
  {
    id: 'budget',
    category: '💰 Comercial',
    text: 'Presupuesto estimado',
    type: 'single',
    options: [
      { value: 'under_300', icon: '💵', title: 'Menos de $300' },
      { value: '300_800', icon: '💵💵', title: '$300 - $800' },
      { value: '800_2000', icon: '💵💵💵', title: '$800 - $2,000' },
      { value: 'over_2000', icon: '🏆', title: 'Más de $2,000' },
    ],
  },
  {
    id: 'urgency',
    category: '💰 Comercial',
    text: 'Urgencia de entrega',
    type: 'single',
    options: [
      { value: 'urgent', icon: '🔥', title: 'Inmediata' },
      { value: 'soon', icon: '⏰', title: 'Próximas semanas' },
      { value: 'exploring', icon: '🔍', title: 'Solo explorando' },
    ],
  },
];

let current = 0;
let answers = {};
let multiSelections = {};

function render(){
  const q = questions[current];
  if(!q) return renderResult();

  const pct = Math.round((current / questions.length) * 100);
  const isMulti = q.type === 'multi';
  let optionsHTML = '';

  if(q.type === 'text'){
    optionsHTML = `<input class="text-input" id="textInput" type="text" placeholder="${q.placeholder}" oninput="answers['${q.id}']=this.value;updateBtn()" onkeydown="if(event.key==='Enter')nextQ()"/>`;
  } else if(q.type === 'single'){
    optionsHTML = '<div class="options">' + q.options.map(o => `
      <button class="option ${answers[q.id] === o.value ? 'selected' : ''}" onclick="selectSingle('${q.id}','${o.value}')">
        <div class="option-icon">${o.icon}</div>
        <div class="option-text"><div class="option-title">${o.title}</div></div>
        <div class="option-check"></div>
      </button>`).join('') + '</div>';
  } else if(isMulti){
    const sel = multiSelections[q.id] || [];
    optionsHTML = '<div class="options">' + q.options.map(o => `
      <button class="option ${sel.includes(o.value) ? 'selected' : ''}" onclick="toggleMulti('${q.id}','${o.value}')">
        <div class="option-icon">${o.icon}</div>
        <div class="option-text"><div class="option-title">${o.title}</div></div>
        <div class="option-check"></div>
      </button>`).join('') + '</div>';
  }

  document.getElementById('app').innerHTML = `
    <div class="progress-wrap">
      <div class="progress-meta"><span class="progress-label">${q.category}</span><span class="progress-count">${current + 1}/${questions.length}</span></div>
      <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
    </div>
    <div class="question-wrap">
      <div class="question-text">${q.text}</div>
      ${q.hint ? `<div class="question-hint">${q.hint}</div>` : ''}
      ${optionsHTML}
      <div class="nav-buttons">
        ${current > 0 ? `<button class="btn-back" onclick="current--;render()">Atrás</button>` : ''}
        <button class="btn-next" id="nextBtn" onclick="nextQ()" ${canProceed(q) ? '' : 'disabled'}>Siguiente →</button>
      </div>
    </div>`;
}

function canProceed(q){
  if(q.type === 'text') return (answers[q.id] || '').length > 0;
  if(q.type === 'single') return answers[q.id] !== undefined;
  if(q.type === 'multi') return (multiSelections[q.id] || []).length > 0;
  return false;
}

function updateBtn(){
  document.getElementById('nextBtn').disabled = !canProceed(questions[current]);
}

function selectSingle(id, val){
  answers[id] = val;
  render();
  setTimeout(nextQ, 300);
}

function toggleMulti(id, val){
  if(!multiSelections[id]) multiSelections[id] = [];
  const idx = multiSelections[id].indexOf(val);
  if(idx > -1) multiSelections[id].splice(idx,1); else multiSelections[id].push(val);
  answers[id] = multiSelections[id];
  render();
}

function nextQ(){
  if(current < questions.length){ current++; render(); }
}

function renderResult(){
  const a = answers;
  let product = 'Landing Page';
  let badge = 'badge-blue';

  if(a.sell_products !== 'services_only' || a.main_goal === 'sell_online') { product = 'E-commerce'; badge = 'badge-green'; }
  if(a.needs_ai !== 'no') { product = 'AI Solutions'; badge = 'badge-yellow'; }

  document.getElementById('app').innerHTML = `
    <div class="result-hero">
      <div class="result-badge ${badge}">RECOMENDACIÓN</div>
      <div style="font-size:1.8rem; font-weight:800; font-family:var(--font-display); margin-bottom:10px">${product}</div>
      <p style="color:var(--text2); font-size:0.9rem">Basado en el brief de ${a.business_name}.</p>
    </div>

    <div class="brief-card">
      <div class="brief-row"><span class="brief-key">Negocio</span><span class="brief-val">${a.business_name}</span></div>
      <div class="brief-row"><span class="brief-key">Colores</span><span class="brief-val" style="color:var(--blue)">${a.custom_colors}</span></div>
      <div class="brief-row"><span class="brief-key">Tipografía</span><span class="brief-val">${a.font_style}</span></div>
      <div class="brief-row"><span class="brief-key">Sensación</span><span class="brief-val">${(a.brand_feeling || []).join(', ')}</span></div>
      <div class="brief-row"><span class="brief-key">Urgencia</span><span class="brief-val">${a.urgency}</span></div>
    </div>

    <button class="btn-copy" onclick="copyBrief()">📋 Copiar Brief para Claude Code</button>
  `;
}

function copyBrief(){
  const a = answers;
  const text = `
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
BRIEF PARA CLAUDE CODE — RUUTDEV
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
CLIENTE: ${a.business_name}
OBJETIVO: ${a.main_goal}
URGENCIA: ${a.urgency}

DISEÑO (IGNORAR ESTILO BASE RUUTDEV):
• COLORES PRIORITARIOS: ${a.custom_colors}
• ESTILO TIPOGRÁFICO: ${a.font_style}
• FEELING: ${(a.brand_feeling || []).join(', ')}
• IDENTIDAD: ${a.has_brand}

ESPECIFICACIONES TÉCNICAS:
• PRODUCTO: ${a.sell_products}
• REQUIERE IA: ${a.needs_ai}
• MERCADO: ${a.location}
• PRESUPUESTO: ${a.budget}

INSTRUCCIÓN ARQUITECTO: 
"Generar código basándose ESTRICTAMENTE en los colores y tipografía del cliente.
No utilizar el azul #1a6dff de RuutDev a menos que el cliente lo haya pedido."
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━`.trim();

  navigator.clipboard.writeText(text).then(() => {
    alert('Brief copiado. Pégalo en tu CLI de Claude Code.');
  });
}

render();
</script>
</body>
</html>

      <div class="field"><label for="businessType" data-en="Business type" data-es="Tipo de negocio">Business type</label><input id="businessType" name="businessType" maxlength="120" aria-describedby="businessType-error" required><span class="error hidden" id="businessType-error"></span></div>

      <div class="field"><label for="timeline" data-en="Desired timeline" data-es="Plazo deseado">Desired timeline</label><select id="timeline" name="timeline" required><option value="exploring" data-en="Exploring options" data-es="Explorando opciones">Exploring options</option><option value="1-2-months" data-en="Within 1–2 months" data-es="En 1–2 meses">Within 1–2 months</option><option value="3-4-months" data-en="Within 3–4 months" data-es="En 3–4 meses">Within 3–4 months</option><option value="flexible" data-en="Flexible" data-es="Flexible">Flexible</option></select></div>

      <div class="field full"><label for="context" data-en="Additional context (optional)" data-es="Contexto adicional (opcional)">Additional context (optional)</label><textarea id="context" name="context" maxlength="2400"></textarea></div>

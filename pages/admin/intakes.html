<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin · Intakes — RuutDev</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800\&family=Figtree:ital,wght@0,300;0,400;0,500;0,600;1,300\&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #07070A;
      --bg-2: #0E0E13;
      --blue: #0A66FF;
      --green: #4ade80;
      --red: #ff5b5b;
      --line: rgba(255,255,255,0.08);
      --text-1: rgba(255,255,255,0.92);
      --text-2: rgba(255,255,255,0.65);
      --text-3: rgba(255,255,255,0.4);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text-1);
      font-family: 'Figtree', system-ui, -apple-system, sans-serif;
      font-size: 14.5px;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
    }
    a { color: var(--blue); text-decoration: none; }
    a:hover { text-decoration: underline; }

    .admin-shell { max-width: 1200px; margin: 0 auto; padding: 24px 20px 80px; }

    /* HEADER */
    .admin-header {
      display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px;
      margin-bottom: 24px; padding-bottom: 20px; border-bottom: 1px solid var(--line);
    }
    .admin-header h1 { font-family: 'Bricolage Grotesque', sans-serif; font-size: 1.7rem; margin: 0; font-weight: 700; }
    .admin-user { font-size: 0.85rem; color: var(--text-2); display: flex; align-items: center; gap: 12px; }
    .btn {
      background: rgba(255,255,255,0.05); border: 1px solid var(--line); color: var(--text-1);
      padding: 8px 14px; border-radius: 6px; font-size: 0.85rem; cursor: pointer;
      font-family: inherit; transition: background .15s, border-color .15s, color .15s;
    }
    .btn:hover { background: rgba(255,255,255,0.08); border-color: rgba(255,255,255,0.18); }
    .btn-primary { background: var(--blue); border-color: var(--blue); color: white; font-weight: 500; }
    .btn-primary:hover { background: #2a78ff; border-color: #2a78ff; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    /* FILTERS */
    .admin-filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 20px; }
    .admin-filter-btn {
      background: rgba(255,255,255,0.04); border: 1px solid var(--line);
      color: var(--text-2); padding: 8px 14px; border-radius: 6px; font-size: 0.85rem;
      font-family: inherit; cursor: pointer; transition: all .15s;
    }
    .admin-filter-btn:hover { color: var(--text-1); }
    .admin-filter-btn.active {
      background: rgba(10,102,255,0.14); border-color: var(--blue); color: var(--text-1);
    }
    .admin-search {
      flex: 1; min-width: 220px;
      background: rgba(255,255,255,0.04); border: 1px solid var(--line);
      color: var(--text-1); padding: 8px 14px; border-radius: 6px; font-size: 0.9rem;
      font-family: inherit;
    }
    .admin-search:focus { outline: none; border-color: var(--blue); background: rgba(255,255,255,0.06); }
    .admin-search::placeholder { color: var(--text-3); }

    /* LOGIN */
    #login-state {
      max-width: 420px; margin: 80px auto; padding: 32px;
      background: rgba(255,255,255,0.03); border: 1px solid var(--line); border-radius: 12px;
      text-align: center;
    }
    #login-state h1 { font-family: 'Bricolage Grotesque', sans-serif; font-size: 1.7rem; margin: 0 0 8px; }
    #login-state p { color: var(--text-2); font-size: 0.92rem; margin: 0 0 24px; }
    #login-state input {
      width: 100%; padding: 12px 16px; margin-bottom: 12px; box-sizing: border-box;
      background: rgba(255,255,255,0.04); border: 1px solid var(--line); border-radius: 8px;
      color: var(--text-1); font-size: 0.95rem; font-family: inherit;
    }
    #login-state input:focus { outline: none; border-color: var(--blue); }
    #login-state button { width: 100%; padding: 12px 16px; }
    #login-message { margin-top: 14px; font-size: 0.85rem; min-height: 20px; }
    #login-message.success { color: var(--green); }
    #login-message.error { color: var(--red); }

    /* LOADING / EMPTY */
    .admin-loading {
      text-align: center; padding: 60px 20px; color: var(--text-3); font-size: 0.92rem;
    }
    .admin-loading::before {
      content: ''; display: block; margin: 0 auto 12px;
      width: 22px; height: 22px; border-radius: 50%;
      border: 3px solid rgba(255,255,255,0.12); border-top-color: var(--blue);
      animation: ad-spin .8s linear infinite;
    }
    @keyframes ad-spin { to { transform: rotate(360deg); } }
    .empty-state { text-align: center; padding: 60px 20px; color: var(--text-3); }

    /* INTAKE CARDS */
    .intake-card {
      background: rgba(255,255,255,0.03); border: 1px solid var(--line); border-radius: 10px;
      margin-bottom: 12px; overflow: hidden; transition: border-color .15s;
    }
    .intake-card:hover { border-color: rgba(255,255,255,0.14); }
    .intake-card.expanded { border-color: var(--blue); }
    .intake-card-summary { padding: 14px 18px; cursor: pointer; }
    .intake-card-summary .row1 {
      display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
    }
    .intake-card-summary .biz { font-weight: 600; font-size: 1.05rem; color: var(--text-1); }
    .intake-card-summary .row2 {
      display: flex; gap: 16px; flex-wrap: wrap; font-size: 0.84rem; color: var(--text-2); margin-top: 6px;
    }
    .intake-card-summary .row2 span { display: inline-flex; align-items: center; gap: 6px; }
    .intake-card-summary .row2 i { color: var(--text-3); width: 14px; text-align: center; }

    .status-badge {
      display: inline-block; padding: 3px 10px; border-radius: 4px;
      font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.06em; font-weight: 700;
      flex-shrink: 0;
    }
    .status-new { background: rgba(10,102,255,0.18); color: #6ea8ff; }
    .status-reviewed { background: rgba(74,222,128,0.16); color: var(--green); }
    .status-archived { background: rgba(255,255,255,0.08); color: var(--text-2); }

    .intake-card-detail { display: none; padding: 0 18px 18px; border-top: 1px solid var(--line); }
    .intake-card.expanded .intake-card-detail { display: block; }

    .detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px 24px; padding: 18px 0; }
    @media (max-width: 720px) { .detail-grid { grid-template-columns: 1fr; } }
    .detail-field { display: grid; gap: 4px; }
    .detail-field.full { grid-column: 1 / -1; }
    .detail-field .label {
      font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.07em; color: var(--text-3); font-weight: 600;
    }
    .detail-field .value { font-size: 0.92rem; color: var(--text-1); word-break: break-word; }
    .detail-field pre {
      white-space: pre-wrap; font-family: inherit; font-size: 0.92rem; margin: 0;
      color: var(--text-1); line-height: 1.5;
    }

    /* FILE GALLERY */
    .file-gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px; margin-top: 4px; }
    .file-tile {
      display: block; aspect-ratio: 1; background: rgba(255,255,255,0.04);
      border-radius: 6px; overflow: hidden; position: relative; border: 1px solid var(--line);
      transition: border-color .15s, transform .15s;
    }
    .file-tile:hover { border-color: var(--blue); transform: scale(1.02); }
    .file-tile img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .file-tile .file-fallback {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      height: 100%; color: var(--text-2); font-size: 1.5rem; gap: 4px;
    }
    .file-tile .file-fallback small { font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.05em; }
    .file-tile .file-name {
      position: absolute; bottom: 0; left: 0; right: 0; padding: 8px 8px 6px;
      font-size: 0.7rem; color: white;
      background: linear-gradient(transparent, rgba(0,0,0,0.85));
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    /* ADMIN CONTROLS */
    .admin-controls {
      display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-start;
      padding: 16px 0 4px; border-top: 1px solid var(--line); margin-top: 12px;
    }
    .admin-controls select {
      background: rgba(255,255,255,0.04); border: 1px solid var(--line);
      color: var(--text-1); padding: 8px 12px; border-radius: 6px; font-size: 0.9rem;
      font-family: inherit; cursor: pointer;
    }
    .admin-controls textarea {
      flex: 1; min-width: 240px; min-height: 60px;
      background: rgba(255,255,255,0.04); border: 1px solid var(--line);
      color: var(--text-1); padding: 10px 12px; border-radius: 6px; font-size: 0.9rem;
      font-family: inherit; resize: vertical;
    }
    .admin-controls textarea:focus, .admin-controls select:focus { outline: none; border-color: var(--blue); }
    .save-indicator { font-size: 0.78rem; color: var(--text-3); align-self: center; min-width: 60px; }
    .save-indicator.saved { color: var(--green); }
    .save-indicator.saving { color: var(--text-2); }
    .save-indicator.error { color: var(--red); }

    /* TABS */
    .admin-tabs {
      display: flex; gap: 4px;
      border-bottom: 1px solid var(--line);
      margin-bottom: 20px; margin-top: -8px;
    }
    .admin-tab-btn {
      background: none; border: none; border-bottom: 2px solid transparent;
      color: var(--text-2); padding: 10px 16px; font-size: 0.92rem;
      font-family: inherit; cursor: pointer;
      display: inline-flex; align-items: center; gap: 8px;
      transition: color .15s, border-color .15s;
      margin-bottom: -1px;
    }
    .admin-tab-btn:hover { color: var(--text-1); }
    .admin-tab-btn.active { color: var(--text-1); border-bottom-color: var(--blue); }
    .tab-count {
      display: inline-block; font-size: 0.72rem;
      background: rgba(255,255,255,0.06); padding: 2px 8px; border-radius: 10px;
      color: var(--text-3); min-width: 18px; text-align: center;
    }
    .admin-tab-btn.active .tab-count { background: rgba(10,102,255,0.18); color: #6ea8ff; }
    .tab-count:empty { display: none; }

    /* REVIEW CARDS */
    .review-card {
      background: rgba(255,255,255,0.03); border: 1px solid var(--line); border-radius: 10px;
      padding: 16px 18px; margin-bottom: 12px; transition: border-color .15s;
    }
    .review-card:hover { border-color: rgba(255,255,255,0.14); }
    .review-row1 {
      display: flex; justify-content: space-between; align-items: center;
      gap: 12px; flex-wrap: wrap; margin-bottom: 6px;
    }
    .review-meta strong { color: var(--text-1); font-weight: 600; }
    .review-meta .muted { color: var(--text-2); }
    .review-stars { color: #f5a623; font-size: 1.05rem; letter-spacing: 2px; margin-bottom: 8px; line-height: 1; }
    .review-text { color: var(--text-1); line-height: 1.5; margin: 8px 0; font-size: 0.95rem; white-space: pre-wrap; }
    .review-footer {
      display: flex; justify-content: space-between; align-items: center;
      flex-wrap: wrap; gap: 12px; margin-top: 12px;
    }
    .review-date { color: var(--text-3); font-size: 0.82rem; }
    .review-actions { display: flex; gap: 8px; flex-wrap: wrap; }

    .status-pending  { background: rgba(245,166,35,0.16); color: #f5a623; }
    .status-approved { background: rgba(74,222,128,0.16); color: var(--green); }

    .btn-danger {
      background: rgba(255,91,91,0.14); border-color: rgba(255,91,91,0.3); color: #ff8a8a;
    }
    .btn-danger:hover { background: rgba(255,91,91,0.22); border-color: rgba(255,91,91,0.55); }

    /* When deep-linked from email, briefly highlight the target card */
    .intake-card.flash-target {
      animation: card-flash 1.6s ease-out 1;
    }
    @keyframes card-flash {
      0%   { box-shadow: 0 0 0 3px rgba(10,102,255,0); }
      30%  { box-shadow: 0 0 0 3px rgba(10,102,255,0.55); }
      100% { box-shadow: 0 0 0 3px rgba(10,102,255,0); }
    }
  </style>
</head>
<body>

<div class="admin-shell">

  <!-- LOGIN STATE -->
  <div id="login-state" style="display:none;">
    <h1>Admin login</h1>
    <p>Enter your admin email — we'll send a magic link to sign you in.</p>
    <input type="email" id="login-email" placeholder="you@example.com" autocomplete="email" />
    <button type="button" class="btn btn-primary" id="login-btn">Send magic link</button>
    <div id="login-message"></div>
  </div>

  <!-- LOADING (auth check on page load) -->
  <div id="loading-state" class="admin-loading">Loading…</div>

  <!-- DASHBOARD -->
  <div id="dashboard-state" style="display:none;">
    <div class="admin-header">
      <h1>Admin Dashboard</h1>
      <div class="admin-user">
        <span><i class="fa-solid fa-user-shield" style="color:var(--blue);"></i> <span id="current-email"></span></span>
        <button type="button" class="btn" id="logout-btn"><i class="fa-solid fa-arrow-right-from-bracket"></i> Logout</button>
      </div>
    </div>

    <div class="admin-tabs">
      <button type="button" class="admin-tab-btn active" data-tab="leads">
        <i class="fa-solid fa-bolt"></i> Leads
        <span class="tab-count" id="tab-count-leads"></span>
      </button>
      <button type="button" class="admin-tab-btn" data-tab="intakes">
        <i class="fa-solid fa-folder-open"></i> Intakes
        <span class="tab-count" id="tab-count-intakes"></span>
      </button>
      <button type="button" class="admin-tab-btn" data-tab="reviews">
        <i class="fa-solid fa-star"></i> Reviews
        <span class="tab-count" id="tab-count-reviews"></span>
      </button>
    </div>

    <!-- LEADS TAB -->
    <div class="tab-content" id="tab-leads">
      <div class="admin-filters">
        <button type="button" class="admin-filter-btn active" data-lstatus="">All</button>
        <button type="button" class="admin-filter-btn" data-lstatus="new">New</button>
        <button type="button" class="admin-filter-btn" data-lstatus="reviewed">Reviewed</button>
        <button type="button" class="admin-filter-btn" data-lstatus="archived">Archived</button>
        <input type="text" class="admin-search" id="admin-search-leads" placeholder="Search name / email / business / industry…" />
        <button type="button" class="admin-filter-btn" id="refresh-leads-btn" title="Refresh">
          <i class="fa-solid fa-rotate"></i>
        </button>
      </div>
      <div id="leads-list" class="admin-loading">Loading leads…</div>
    </div>

    <!-- INTAKES TAB -->
    <div class="tab-content" id="tab-intakes" style="display:none;">
      <div class="admin-filters">
        <button type="button" class="admin-filter-btn active" data-status="">All</button>
        <button type="button" class="admin-filter-btn" data-status="new">New</button>
        <button type="button" class="admin-filter-btn" data-status="reviewed">Reviewed</button>
        <button type="button" class="admin-filter-btn" data-status="archived">Archived</button>
        <input type="text" class="admin-search" id="admin-search" placeholder="Search business / contact / email…" />
        <button type="button" class="admin-filter-btn" id="refresh-btn" title="Refresh">
          <i class="fa-solid fa-rotate"></i>
        </button>
      </div>
      <div id="intakes-list" class="admin-loading">Loading intakes…</div>
    </div>

    <!-- REVIEWS TAB -->
    <div class="tab-content" id="tab-reviews" style="display:none;">
      <div class="admin-filters">
        <button type="button" class="admin-filter-btn active" data-rstatus="pending">Pending</button>
        <button type="button" class="admin-filter-btn" data-rstatus="approved">Approved</button>
        <button type="button" class="admin-filter-btn" data-rstatus="all">All</button>
        <input type="text" class="admin-search" id="admin-search-reviews" placeholder="Search name / business / text…" />
        <button type="button" class="admin-filter-btn" id="refresh-reviews-btn" title="Refresh">
          <i class="fa-solid fa-rotate"></i>
        </button>
      </div>
      <div id="reviews-list" class="admin-loading">Loading moderation queue…</div>
    </div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  /* ──────────── State ──────────── */
  let supabaseClient = null;
  let currentSession = null;
  let activeTab = 'leads';

  // Leads (Google Ads LP and any future top-of-funnel form)
  let cachedLeads = [];
  let activeLeadStatus = '';
  let activeLeadSearch = '';

  // Intakes
  let cachedIntakes = [];
  let activeStatus = '';
  let activeSearch = '';

  // Reviews
  let cachedReviews = [];
  let activeReviewStatus = 'pending';
  let activeReviewSearch = '';

  // Stashed deep-link from URL hash (e.g. /admin/intakes#<intake-id> from email).
  // Captured on script load before Supabase auth strips the hash on magic-link return.
  const deepLinkIntakeId = (() => {
    const h = (window.location.hash || '').replace(/^#/, '');
    return /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(h) ? h : null;
  })();
  let deepLinkApplied = false;

  const $ = id => document.getElementById(id);
  const escHtml = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  const PREVIEWABLE = new Set(['image/jpeg','image/jpg','image/png','image/gif','image/webp','image/svg+xml']);

  /* ──────────── Init / auth ──────────── */
  async function init() {
    try {
      const cfgRes = await fetch('/api/public-config');
      if (!cfgRes.ok) throw new Error('Could not load Supabase config');
      const cfg = await cfgRes.json();

      supabaseClient = window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseAnonKey, {
        auth: { detectSessionInUrl: true, persistSession: true, autoRefreshToken: true, flowType: 'pkce' }
      });

      supabaseClient.auth.onAuthStateChange((_event, session) => {
        currentSession = session;
        if (session) showDashboard();
        else if (_event === 'SIGNED_OUT') showLogin();
      });

      const { data } = await supabaseClient.auth.getSession();
      currentSession = data?.session || null;

      if (currentSession) showDashboard();
      else showLogin();
    } catch (err) {
      console.error('Init error:', err);
      $('loading-state').textContent = 'Could not load admin: ' + (err.message || 'unknown error');
    }
  }

  async function sendMagicLink() {
    const emailInput = $('login-email');
    const btn = $('login-btn');
    const msg = $('login-message');
    const email = emailInput.value.trim();

    msg.className = '';
    msg.textContent = '';

    if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
      msg.className = 'error';
      msg.textContent = 'Enter a valid email.';
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Sending…';
    try {
      const { error } = await supabaseClient.auth.signInWithOtp({
        email,
        options: { emailRedirectTo: window.location.origin + '/admin/intakes' }
      });
      if (error) throw error;
      msg.className = 'success';
      msg.textContent = `Magic link sent to ${email}. Check your inbox (and spam folder).`;
    } catch (err) {
      msg.className = 'error';
      msg.textContent = err.message || 'Could not send magic link.';
    } finally {
      btn.disabled = false;
      btn.textContent = 'Send magic link';
    }
  }

  async function logout() {
    await supabaseClient.auth.signOut();
    currentSession = null;
    cachedLeads = [];
    cachedIntakes = [];
    cachedReviews = [];
    showLogin();
  }

  /* ──────────── Views ──────────── */
  function showLogin() {
    $('login-state').style.display = 'block';
    $('loading-state').style.display = 'none';
    $('dashboard-state').style.display = 'none';
  }
  function showDashboard() {
    $('login-state').style.display = 'none';
    $('loading-state').style.display = 'none';
    $('dashboard-state').style.display = 'block';
    $('current-email').textContent = currentSession.user.email;
    loadLeads();
    loadIntakes();
    loadReviews(); // load all upfront so tab-count badges populate
  }

  function switchTab(tab) {
    if (tab === activeTab) return;
    activeTab = tab;
    document.querySelectorAll('.admin-tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
    document.querySelectorAll('.tab-content').forEach(c => {
      c.style.display = c.id === `tab-${tab}` ? 'block' : 'none';
    });
  }

  /* ──────────── LEADS ──────────── */
  async function loadLeads() {
    if (!currentSession) return showLogin();
    const list = $('leads-list');
    list.className = 'admin-loading';
    list.textContent = 'Loading leads…';

    try {
      const url = '/api/admin/leads' + (activeLeadStatus ? `?status=${encodeURIComponent(activeLeadStatus)}` : '');
      const res = await fetch(url, {
        headers: { Authorization: `Bearer ${currentSession.access_token}` }
      });

      if (res.status === 401) {
        list.className = 'empty-state';
        list.innerHTML = `<i class="fa-solid fa-shield-halved" style="font-size:2rem;color:var(--text-3);margin-bottom:12px;display:block;"></i>
          <strong style="color:var(--text-1);">Access denied</strong><br />
          <span>Your email is not on the admin allowlist.</span><br /><br />
          <button class="btn" onclick="logout()">Sign out</button>`;
        return;
      }
      if (!res.ok) throw new Error(`HTTP ${res.status}`);

      const data = await res.json();
      cachedLeads = data.leads || [];
      renderLeads();
      updateTabCounts();
    } catch (err) {
      console.error('Load leads error:', err);
      list.className = 'empty-state';
      list.textContent = 'Could not load leads: ' + (err.message || 'unknown error');
    }
  }

  function renderLeads() {
    const list = $('leads-list');
    list.className = '';

    const search = activeLeadSearch.toLowerCase();
    const filtered = search
      ? cachedLeads.filter(l =>
          (l.name     || '').toLowerCase().includes(search) ||
          (l.email    || '').toLowerCase().includes(search) ||
          (l.business || '').toLowerCase().includes(search) ||
          (l.industry || '').toLowerCase().includes(search) ||
          (l.message  || '').toLowerCase().includes(search))
      : cachedLeads;

    if (filtered.length === 0) {
      list.className = 'empty-state';
      list.textContent = activeLeadSearch ? 'No matches.' : 'No leads yet.';
      return;
    }

    list.innerHTML = filtered.map(leadCardHtml).join('');
  }

  function leadCardHtml(lead) {
    const date = new Date(lead.created_at).toLocaleString();
    const sourceLabel = lead.source === 'google_ads_lp' ? 'Google Ads' : (lead.source || 'website');
    return `
      <div class="intake-card" data-lead-id="${escHtml(lead.id)}">
        <div class="intake-card-summary">
          <div class="row1">
            <div class="biz">${escHtml(lead.name)}${lead.business ? ` <span style="color:var(--text-3);font-weight:400;">· ${escHtml(lead.business)}</span>` : ''}</div>
            <span class="status-badge status-${escHtml(lead.status)}">${escHtml(lead.status)}</span>
          </div>
          <div class="row2">
            <span><i class="fa-regular fa-envelope"></i> <a href="mailto:${escHtml(lead.email)}">${escHtml(lead.email)}</a></span>
            ${lead.industry ? `<span><i class="fa-solid fa-briefcase"></i> ${escHtml(lead.industry)}</span>` : ''}
            <span><i class="fa-solid fa-bullseye"></i> ${escHtml(sourceLabel)}</span>
            <span><i class="fa-regular fa-clock"></i> ${escHtml(date)}</span>
          </div>
        </div>
        <div class="intake-card-detail">
          <div class="detail-grid">
            ${detailField('What they need', lead.message, true, true)}
            ${detailField('Source', lead.source)}
            ${detailField('Landing page', lead.landing_page)}
            ${detailField('Referrer', lead.referrer)}
            ${detailField('UTM source', lead.utm_source)}
            ${detailField('UTM medium', lead.utm_medium)}
            ${detailField('UTM campaign', lead.utm_campaign)}
            ${detailField('UTM term', lead.utm_term)}
            ${detailField('UTM content', lead.utm_content)}
            ${detailField('Page URL', lead.page_url, true, false, true)}
          </div>
          <div class="admin-controls">
            <select data-lead-action="status" data-id="${escHtml(lead.id)}">
              <option value="new"      ${lead.status === 'new'      ? 'selected' : ''}>Status: New</option>
              <option value="reviewed" ${lead.status === 'reviewed' ? 'selected' : ''}>Status: Reviewed</option>
              <option value="archived" ${lead.status === 'archived' ? 'selected' : ''}>Status: Archived</option>
            </select>
            <textarea data-lead-action="notes" data-id="${escHtml(lead.id)}" placeholder="Admin notes (only you see these)…">${escHtml(lead.admin_notes || '')}</textarea>
            <span class="save-indicator" id="lead-save-${escHtml(lead.id)}"></span>
          </div>
        </div>
      </div>
    `;
  }

  async function patchLead(id, payload, indicator) {
    setIndicator(indicator, 'saving', 'Saving…');
    try {
      const res = await fetch('/api/admin/leads', {
        method: 'PATCH',
        headers: {
          'Content-Type': 'application/json',
          Authorization: `Bearer ${currentSession.access_token}`
        },
        body: JSON.stringify({ id, ...payload })
      });
      if (!res.ok) {
        const e = await res.json().catch(() => ({}));
        throw new Error(e.error || `HTTP ${res.status}`);
      }
      const data = await res.json();
      const idx = cachedLeads.findIndex(l => l.id === id);
      if (idx >= 0) cachedLeads[idx] = data.lead;
      setIndicator(indicator, 'saved', 'Saved');
      setTimeout(() => setIndicator(indicator, '', ''), 1800);
      updateTabCounts();
      return data.lead;
    } catch (err) {
      console.error('Patch lead error:', err);
      setIndicator(indicator, 'error', 'Failed');
      return null;
    }
  }

  /* ──────────── INTAKES ──────────── */
  async function loadIntakes() {
    if (!currentSession) return showLogin();
    const list = $('intakes-list');
    list.className = 'admin-loading';
    list.textContent = 'Loading intakes…';

    try {
      const url = '/api/admin/intakes' + (activeStatus ? `?status=${encodeURIComponent(activeStatus)}` : '');
      const res = await fetch(url, {
        headers: { Authorization: `Bearer ${currentSession.access_token}` }
      });

      if (res.status === 401) {
        list.className = 'empty-state';
        list.innerHTML = `<i class="fa-solid fa-shield-halved" style="font-size:2rem;color:var(--text-3);margin-bottom:12px;display:block;"></i>
          <strong style="color:var(--text-1);">Access denied</strong><br />
          <span>Your email is not on the admin allowlist.</span><br /><br />
          <button class="btn" onclick="logout()">Sign out</button>`;
        return;
      }
      if (!res.ok) throw new Error(`HTTP ${res.status}`);

      const data = await res.json();
      cachedIntakes = data.intakes || [];
      renderIntakes();
      updateTabCounts();
    } catch (err) {
      console.error('Load intakes error:', err);
      list.className = 'empty-state';
      list.textContent = 'Could not load intakes: ' + (err.message || 'unknown error');
    }
  }

  function renderIntakes() {
    const list = $('intakes-list');
    list.className = '';

    const search = activeSearch.toLowerCase();
    const filtered = search
      ? cachedIntakes.filter(i =>
          (i.business_name || '').toLowerCase().includes(search) ||
          (i.contact_name  || '').toLowerCase().includes(search) ||
          (i.email         || '').toLowerCase().includes(search))
      : cachedIntakes;

    if (filtered.length === 0) {
      list.className = 'empty-state';
      list.textContent = activeSearch ? 'No matches.' : 'No intakes yet.';
      return;
    }

    list.innerHTML = filtered.map(intake => intakeCardHtml(intake)).join('');
    maybeApplyDeepLink();
  }

  function maybeApplyDeepLink() {
    if (!deepLinkIntakeId || deepLinkApplied) return;
    const card = document.querySelector(`.intake-card[data-id="${deepLinkIntakeId}"]`);
    if (!card) return;
    deepLinkApplied = true;
    if (activeTab !== 'intakes') switchTab('intakes');
    card.classList.add('expanded', 'flash-target');
    setTimeout(() => card.classList.remove('flash-target'), 1800);
    setTimeout(() => card.scrollIntoView({ behavior: 'smooth', block: 'center' }), 50);
  }

  function intakeCardHtml(intake) {
    const date = new Date(intake.created_at).toLocaleString();
    return `
      <div class="intake-card" data-id="${escHtml(intake.id)}">
        <div class="intake-card-summary">
          <div class="row1">
            <div class="biz">${escHtml(intake.business_name)}</div>
            <span class="status-badge status-${escHtml(intake.status)}">${escHtml(intake.status)}</span>
          </div>
          <div class="row2">
            <span><i class="fa-regular fa-user"></i> ${escHtml(intake.contact_name)}</span>
            <span><i class="fa-regular fa-envelope"></i> <a href="mailto:${escHtml(intake.email)}">${escHtml(intake.email)}</a></span>
            ${intake.phone ? `<span><i class="fa-regular fa-comment"></i> ${escHtml(intake.phone)}</span>` : ''}
            <span><i class="fa-regular fa-clock"></i> ${escHtml(date)}</span>
            ${intake.stage ? `<span><i class="fa-solid fa-tag"></i> ${escHtml(intake.stage)}</span>` : ''}
          </div>
        </div>
        <div class="intake-card-detail">
          <div class="detail-grid">
            ${detailField('Target domain', intake.target_domain)}
            ${detailField('Current site', intake.current_site_url, false, false, true)}
            ${detailField('Main objective', intake.main_objective)}
            ${detailField('Site language', intake.site_language)}
            ${detailField('Google Business Profile', intake.google_business_profile)}
            ${detailField('Brand colors', intake.brand_colors)}
            ${detailField('Social media', intake.social_media_links, true)}
            ${detailField('Services / products to feature', intake.services_to_feature, true, true)}
            ${detailField('Inspiration', intake.inspiration, true, true)}
            ${detailField('Customer notes', intake.notes, true, true)}
            ${fileFieldHtml('Logo & brand assets', intake.logo_files)}
            ${fileFieldHtml('Photos', intake.photo_files)}
          </div>
          <div class="admin-controls">
            <select data-action="status" data-id="${escHtml(intake.id)}">
              <option value="new"      ${intake.status === 'new'      ? 'selected' : ''}>Status: New</option>
              <option value="reviewed" ${intake.status === 'reviewed' ? 'selected' : ''}>Status: Reviewed</option>
              <option value="archived" ${intake.status === 'archived' ? 'selected' : ''}>Status: Archived</option>
            </select>
            <textarea data-action="notes" data-id="${escHtml(intake.id)}" placeholder="Admin notes (only you see these)…">${escHtml(intake.admin_notes || '')}</textarea>
            <span class="save-indicator" id="save-${escHtml(intake.id)}"></span>
          </div>
        </div>
      </div>
    `;
  }

  function detailField(label, value, fullWidth = false, asPre = false, isLink = false) {
    if (!value) return '';
    const cls = 'detail-field' + (fullWidth ? ' full' : '');
    let body;
    if (asPre) body = `<pre>${escHtml(value)}</pre>`;
    else if (isLink && /^https?:\/\//i.test(value)) body = `<span class="value"><a href="${escHtml(value)}" target="_blank" rel="noopener noreferrer">${escHtml(value)}</a></span>`;
    else body = `<span class="value">${escHtml(value)}</span>`;
    return `<div class="${cls}"><span class="label">${escHtml(label)}</span>${body}</div>`;
  }

  function fileFieldHtml(label, files) {
    if (!Array.isArray(files) || files.length === 0) return '';
    const items = files.map(f => {
      const previewable = PREVIEWABLE.has((f.type || '').toLowerCase());
      const ext = (f.name || '').split('.').pop().slice(0, 5).toUpperCase();
      const inner = previewable
        ? `<img src="${escHtml(f.url)}" alt="${escHtml(f.name)}" loading="lazy" />`
        : `<div class="file-fallback"><i class="fa-solid fa-file"></i><small>${escHtml(ext || 'file')}</small></div>`;
      return `<a class="file-tile" href="${escHtml(f.url)}" target="_blank" rel="noopener noreferrer" title="${escHtml(f.name)}">
        ${inner}
        <span class="file-name">${escHtml(f.name)}</span>
      </a>`;
    }).join('');
    return `<div class="detail-field full">
      <span class="label">${escHtml(label)} (${files.length})</span>
      <div class="file-gallery">${items}</div>
    </div>`;
  }

  /* ──────────── Card actions ──────────── */
  async function patchIntake(id, payload, indicator) {
    setIndicator(indicator, 'saving', 'Saving…');
    try {
      const res = await fetch('/api/admin/intakes', {
        method: 'PATCH',
        headers: {
          'Content-Type': 'application/json',
          Authorization: `Bearer ${currentSession.access_token}`
        },
        body: JSON.stringify({ id, ...payload })
      });
      if (!res.ok) {
        const e = await res.json().catch(() => ({}));
        throw new Error(e.error || `HTTP ${res.status}`);
      }
      const data = await res.json();
      const idx = cachedIntakes.findIndex(i => i.id === id);
      if (idx >= 0) cachedIntakes[idx] = data.intake;
      setIndicator(indicator, 'saved', 'Saved');
      setTimeout(() => setIndicator(indicator, '', ''), 1800);
      updateTabCounts();
      return data.intake;
    } catch (err) {
      console.error('Patch error:', err);
      setIndicator(indicator, 'error', 'Failed');
      return null;
    }
  }

  function setIndicator(el, cls, text) {
    if (!el) return;
    el.className = 'save-indicator' + (cls ? ' ' + cls : '');
    el.textContent = text;
  }

  /* ──────────── REVIEWS ──────────── */
  async function loadReviews() {
    if (!currentSession) return showLogin();
    const list = $('reviews-list');
    list.className = 'admin-loading';
    list.textContent = 'Loading moderation queue…';

    try {
      const url = '/api/admin/reviews?status=' + encodeURIComponent(activeReviewStatus);
      const res = await fetch(url, {
        headers: { Authorization: `Bearer ${currentSession.access_token}` }
      });

      if (res.status === 401) {
        list.className = 'empty-state';
        list.textContent = 'Access denied — your email is not on the admin allowlist.';
        return;
      }
      if (!res.ok) throw new Error(`HTTP ${res.status}`);

      const data = await res.json();
      cachedReviews = data.reviews || [];
      renderReviews();
      updateTabCounts();
    } catch (err) {
      console.error('Load reviews error:', err);
      list.className = 'empty-state';
      list.textContent = 'Could not load reviews: ' + (err.message || 'unknown error');
    }
  }

  function renderReviews() {
    const list = $('reviews-list');
    list.className = '';

    const search = activeReviewSearch.toLowerCase();
    const filtered = search
      ? cachedReviews.filter(r =>
          (r.name     || '').toLowerCase().includes(search) ||
          (r.business || '').toLowerCase().includes(search) ||
          (r.review   || '').toLowerCase().includes(search))
      : cachedReviews;

    if (filtered.length === 0) {
      list.className = 'empty-state';
      list.textContent = activeReviewSearch ? 'No matches.' : 'No reviews here.';
      return;
    }

    list.innerHTML = filtered.map(reviewCardHtml).join('');
  }

  function reviewCardHtml(r) {
    const date = new Date(r.created_at).toLocaleString();
    const stars = '★'.repeat(r.rating) + '☆'.repeat(5 - r.rating);
    const isApproved = !!r.is_approved;
    return `
      <div class="review-card" data-id="${escHtml(r.id)}">
        <div class="review-row1">
          <div class="review-meta">
            <strong>${escHtml(r.name)}</strong>
            ${r.business ? `<span class="muted"> · ${escHtml(r.business)}</span>` : ''}
          </div>
          <span class="status-badge ${isApproved ? 'status-approved' : 'status-pending'}">
            ${isApproved ? 'Approved' : 'Pending'}
          </span>
        </div>
        <div class="review-stars" aria-label="${r.rating} out of 5">${stars}</div>
        <p class="review-text">${escHtml(r.review)}</p>
        <div class="review-footer">
          <span class="review-date"><i class="fa-regular fa-clock"></i> ${escHtml(date)}</span>
          <div class="review-actions">
            ${isApproved
              ? `<button type="button" class="btn" data-review-action="unapprove" data-id="${escHtml(r.id)}"><i class="fa-solid fa-rotate-left"></i> Unapprove</button>`
              : `<button type="button" class="btn btn-primary" data-review-action="approve" data-id="${escHtml(r.id)}"><i class="fa-solid fa-check"></i> Approve</button>`}
            <button type="button" class="btn btn-danger" data-review-action="delete" data-id="${escHtml(r.id)}"><i class="fa-solid fa-trash"></i> Delete</button>
          </div>
        </div>
      </div>
    `;
  }

  async function performReviewAction(id, action) {
    if (action === 'delete') {
      if (!confirm('Delete this review permanently? This cannot be undone.')) return;
      try {
        const res = await fetch('/api/admin/reviews', {
          method: 'DELETE',
          headers: {
            'Content-Type': 'application/json',
            Authorization: `Bearer ${currentSession.access_token}`
          },
          body: JSON.stringify({ id })
        });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        cachedReviews = cachedReviews.filter(r => r.id !== id);
        renderReviews();
        updateTabCounts();
      } catch (err) {
        alert('Could not delete: ' + (err.message || 'unknown error'));
      }
      return;
    }

    const is_approved = action === 'approve';
    try {
      const res = await fetch('/api/admin/reviews', {
        method: 'PATCH',
        headers: {
          'Content-Type': 'application/json',
          Authorization: `Bearer ${currentSession.access_token}`
        },
        body: JSON.stringify({ id, is_approved })
      });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      const idx = cachedReviews.findIndex(r => r.id === id);
      if (idx >= 0) cachedReviews[idx] = data.review;

      // If we're filtering by pending and the review was just approved (or vice versa),
      // it no longer matches the filter — drop it from the visible list.
      if (activeReviewStatus === 'pending' && is_approved) {
        cachedReviews = cachedReviews.filter(r => r.id !== id);
      } else if (activeReviewStatus === 'approved' && !is_approved) {
        cachedReviews = cachedReviews.filter(r => r.id !== id);
      }

      renderReviews();
      updateTabCounts();
    } catch (err) {
      alert('Could not update: ' + (err.message || 'unknown error'));
    }
  }

  /* ──────────── Tab counts ──────────── */
  function updateTabCounts() {
    const newLeads = cachedLeads.filter(l => l.status === 'new').length;
    const leadsBadge = $('tab-count-leads');
    if (leadsBadge) leadsBadge.textContent = newLeads > 0 ? newLeads : '';

    const newIntakes = cachedIntakes.filter(i => i.status === 'new').length;
    const intakesBadge = $('tab-count-intakes');
    if (intakesBadge) intakesBadge.textContent = newIntakes > 0 ? newIntakes : '';

    const pendingReviews = cachedReviews.filter(r => !r.is_approved).length;
    const reviewsBadge = $('tab-count-reviews');
    if (reviewsBadge) reviewsBadge.textContent = pendingReviews > 0 ? pendingReviews : '';
  }

  /* ──────────── Event delegation ──────────── */
  const notesSaveTimers = {};

  document.addEventListener('click', (e) => {
    // Tab buttons
    const tabBtn = e.target.closest('.admin-tab-btn[data-tab]');
    if (tabBtn) {
      switchTab(tabBtn.dataset.tab);
      return;
    }

    // Leads filter buttons
    const lfb = e.target.closest('.admin-filter-btn[data-lstatus]');
    if (lfb) {
      document.querySelectorAll('.admin-filter-btn[data-lstatus]').forEach(b => b.classList.remove('active'));
      lfb.classList.add('active');
      activeLeadStatus = lfb.dataset.lstatus || '';
      loadLeads();
      return;
    }

    // Intakes filter buttons
    const fb = e.target.closest('.admin-filter-btn[data-status]');
    if (fb) {
      document.querySelectorAll('.admin-filter-btn[data-status]').forEach(b => b.classList.remove('active'));
      fb.classList.add('active');
      activeStatus = fb.dataset.status || '';
      loadIntakes();
      return;
    }

    // Reviews filter buttons
    const rfb = e.target.closest('.admin-filter-btn[data-rstatus]');
    if (rfb) {
      document.querySelectorAll('.admin-filter-btn[data-rstatus]').forEach(b => b.classList.remove('active'));
      rfb.classList.add('active');
      activeReviewStatus = rfb.dataset.rstatus || 'all';
      loadReviews();
      return;
    }

    // Review action buttons
    const ra = e.target.closest('button[data-review-action]');
    if (ra) {
      performReviewAction(ra.dataset.id, ra.dataset.reviewAction);
      return;
    }

    // Card summary toggle (intakes + leads share the .intake-card-summary class)
    const summary = e.target.closest('.intake-card-summary');
    if (summary && !e.target.closest('a')) {
      summary.parentElement.classList.toggle('expanded');
    }
  });

  document.addEventListener('change', async (e) => {
    // Intake status select
    const sel = e.target.closest('select[data-action="status"]');
    if (sel) {
      const id = sel.dataset.id;
      const indicator = $(`save-${id}`);
      const updated = await patchIntake(id, { status: sel.value }, indicator);
      if (updated) {
        const card = document.querySelector(`.intake-card[data-id="${id}"]`);
        const badge = card?.querySelector('.status-badge');
        if (badge) {
          badge.className = `status-badge status-${updated.status}`;
          badge.textContent = updated.status;
        }
      }
      return;
    }
    // Lead status select
    const leadSel = e.target.closest('select[data-lead-action="status"]');
    if (leadSel) {
      const id = leadSel.dataset.id;
      const indicator = $(`lead-save-${id}`);
      const updated = await patchLead(id, { status: leadSel.value }, indicator);
      if (updated) {
        const card = document.querySelector(`.intake-card[data-lead-id="${id}"]`);
        const badge = card?.querySelector('.status-badge');
        if (badge) {
          badge.className = `status-badge status-${updated.status}`;
          badge.textContent = updated.status;
        }
      }
    }
  });

  document.addEventListener('input', (e) => {
    // Intake notes
    const ta = e.target.closest('textarea[data-action="notes"]');
    if (ta) {
      const id = ta.dataset.id;
      const indicator = $(`save-${id}`);
      setIndicator(indicator, '', 'Editing…');
      clearTimeout(notesSaveTimers[id]);
      notesSaveTimers[id] = setTimeout(() => patchIntake(id, { admin_notes: ta.value }, indicator), 800);
      return;
    }
    // Lead notes
    const leadTa = e.target.closest('textarea[data-lead-action="notes"]');
    if (leadTa) {
      const id = leadTa.dataset.id;
      const indicator = $(`lead-save-${id}`);
      setIndicator(indicator, '', 'Editing…');
      clearTimeout(notesSaveTimers['lead-' + id]);
      notesSaveTimers['lead-' + id] = setTimeout(() => patchLead(id, { admin_notes: leadTa.value }, indicator), 800);
    }
  });

  // Top-level button wiring
  $('login-btn').addEventListener('click', sendMagicLink);
  $('login-email').addEventListener('keydown', (e) => { if (e.key === 'Enter') sendMagicLink(); });
  $('logout-btn').addEventListener('click', logout);
  $('refresh-btn').addEventListener('click', loadIntakes);
  $('refresh-leads-btn').addEventListener('click', loadLeads);
  $('refresh-reviews-btn').addEventListener('click', loadReviews);

  let intakesSearchTimer;
  $('admin-search').addEventListener('input', (e) => {
    clearTimeout(intakesSearchTimer);
    intakesSearchTimer = setTimeout(() => {
      activeSearch = e.target.value.trim();
      renderIntakes();
    }, 200);
  });

  let leadsSearchTimer;
  $('admin-search-leads').addEventListener('input', (e) => {
    clearTimeout(leadsSearchTimer);
    leadsSearchTimer = setTimeout(() => {
      activeLeadSearch = e.target.value.trim();
      renderLeads();
    }, 200);
  });

  let reviewsSearchTimer;
  $('admin-search-reviews').addEventListener('input', (e) => {
    clearTimeout(reviewsSearchTimer);
    reviewsSearchTimer = setTimeout(() => {
      activeReviewSearch = e.target.value.trim();
      renderReviews();
    }, 200);
  });

  // expose logout for inline access-denied button
  window.logout = logout;

  init();
</script>
</body>
</html>
